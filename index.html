<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Index Chat — Приватная Комната</title>
    
    <!-- Иконки Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Сброс стилей и Переменные */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        :root {
            --primary-color: #007aff;
            --primary-gradient: linear-gradient(135deg, #007aff, #0051af);
            --bg-light: #f2f2f7;
            --bg-dark: #000000;
            --sidebar-light: rgba(245, 245, 247, 0.85);
            --sidebar-dark: rgba(22, 22, 23, 0.85);
            --chat-light: rgba(255, 255, 255, 0.7);
            --chat-dark: rgba(28, 28, 30, 0.7);
            --border-light: rgba(0, 0, 0, 0.1);
            --border-dark: rgba(255, 255, 255, 0.1);
            --text-light: #1d1d1f;
            --text-dark: #f5f5f7;
            --text-secondary-light: #86868b;
            --text-secondary-dark: #8e8e93;
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            --ios-bubble-incoming-light: #e9e9eb;
            --ios-bubble-incoming-dark: #262629;
            --ios-bubble-outgoing: #007aff;
            --transition-speed: 0.3s;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #e2e8f0, #cbd5e1);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            transition: background var(--transition-speed) ease;
        }

        body.dark-theme {
            background: radial-gradient(circle at 50% 50%, #1c1c1e, #000000);
            color: var(--text-dark);
        }

        /* Главный Контейнер (Адаптирован под мобильные и десктоп) */
        .app-container {
            width: 100%;
            height: 100%;
            background: var(--chat-light);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            position: relative;
            transition: background var(--transition-speed) ease;
        }

        @media (min-width: 769px) {
            /* Стили для десктопных экранов */
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Контент приложения (чат, боковая панель и т.д.) -->
    </div>

</body>
</html>
