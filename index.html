<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruru Burger</title>
    <style>
        /* Стиль в духе пиксельных игр */
        @import url('https://googleapis.com');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: #2c3e50;
            font-family: 'Press Start 2P', monospace;
            color: #fff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 100%;
            max-height: 450px;
            background: #34495e;
            border: 4px solid #f1c40f;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }

        /* Верхняя панель */
        #ui-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            background: rgba(0,0,0,0.7);
            padding: 8px;
            border: 2px solid #fff;
            pointer-events: none;
        }

        /* Кнопки меню улучшений */
        #shop-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: #e67e22;
            border: 2px solid #fff;
            color: white;
            padding: 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            cursor: pointer;
            z-index: 10;
        }

        /* Модальное окно магазина */
        #shop-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            background: rgba(0, 0, 0, 0.95);
            border: 4px solid #e67e22;
            padding: 15px;
            z-index: 20;
            font-size: 8px;
        }

        #shop-modal h2 {
            text-align: center;
            color: #f1c40f;
            margin-top: 0;
            font-size: 12px;
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            padding: 5px;
            border-bottom: 1px dashed #fff;
        }

        .shop-item button {
            background: #2ecc71;
            border: 1px solid #fff;
            color: white;
            padding: 5px;
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            cursor: pointer;
        }

        #close-shop {
            display: block;
            margin: 15px auto 0 auto;
            background: #e74c3c;
            color: white;
            border: 2px solid #fff;
            padding: 5px 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            cursor: pointer;
        }

        /* Сенсорное управление для мобильных */
        #mobile-controls {
            display: none;
            position: absolute;
            bottom: 10px;
            left: 10px;
            gap: 10px;
            z-index: 10;
        }

        .btn-touch {
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,0.3);
            border: 2px solid #fff;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            #mobile-controls { display: flex; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Экран игры -->
        <canvas id="gameCanvas" width="800" height="450"></canvas>

        <!-- Интерфейс -->
        <div id="ui-panel">
            <div id="score-display">Деньги: $0</div>
            <div id="level-display">Кафе: Ур. 1</div>
        </div>

        <button id="shop-btn">Улучшить</button>

        <!-- Мобильные кнопки -->
        <div id="mobile-controls">
            <div class="btn-touch" id="btn-left">◀</div>
            <div class="btn-touch" id="btn-action">🍔</div>
            <div class="btn-touch" id="btn-right">▶</div>
        </div>

        <!-- Магазин улучшений -->
        <div id="shop-modal">
            <h2>Ruru Burger - Меню</h2>
            <div id="shop-items-container"></div>
            <button id="close-shop">Закрыть</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Игровое состояние
        let money = 0;
        let cafeLevel = 1;
        let activeHero = 'tevos'; // Тевос по умолчанию

        // База меню и улучшений
        const upgrades = [
            { id: 'dish1', name: 'Кола', cost: 15, bought: false, type: 'menu', reward: 5 },
            { id: 'dish2', name: 'Картошка', cost: 40, bought: false, type: 'menu', reward: 10 },
            { id: 'dish3', name: 'Мега Бургер', cost: 100, bought: false, type: 'menu', reward: 25 },
            { id: 'interior', name: 'Новые столы', cost: 150, bought: false, type: 'cafe', reward: 0 }
        ];

        // Персонажи (Тевос и Малой)
        const heroes = {
            tevos: { x: 350, y: 230, width: 40, height: 50, color: '#d35400', name: 'Тевос', desc: 'Маленький, бородатый' },
            maloy: { x: 410, y: 210, width: 30, height: 70, color: '#2980b9', name: 'Малой', desc: 'Длинный, худой' }
        };

        // Посетители
        let customers = [];
        const customerColors = ['#95a5a6', '#amethyst', '#1abc9c', '#9b59b6', '#f1c40f'];

        // Кнопки управления
        let keys = { left: false, right: false };

        // Инициализация посетителя
        function spawnCustomer() {
            if (customers.length < 4) {
                customers.push({
                    x: -30,
                    y: 280,
                    targetX: 150 + Math.random() * 400,
                    width: 35,
                    height: 55,
                    color: customerColors[Math.floor(Math.random() * customerColors.length)],
                    state: 'walking', // walking, waiting, leaving
                    timer: 0,
                    orderPaid: false
                });
            }
        }

        // Отрисовка пиксельного интерьера кафе
        function drawBackground() {
            // Стены
            ctx.fillStyle = cafeLevel === 1 ? '#7f8c8d' : '#bdc3c7';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Пол
            ctx.fillStyle = '#795548';
            ctx.fillRect(0, 300, canvas.width, 150);
            
            // Плинтус
            ctx.fillStyle = '#4e342e';
            ctx.fillRect(0, 290, canvas.width, 10);

            // Стойка выдачи
            ctx.fillStyle = '#e67e22';
            ctx.fillRect(200, 250, 400, 50);
            ctx.fillStyle = '#d35400';
            ctx.fillRect(200, 245, 400, 5);

            // Вывеска Ruru Burger
            ctx.fillStyle = '#000';
            ctx.fillRect(280, 20, 240, 50);
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 4;
            ctx.strokeRect(280, 20, 240, 50);
            ctx.fillStyle = '#f1c40f';
            ctx.font = '16px "Press Start 2P"';
            ctx.fillText('RURU BURGER', 295, 52);
        }

        // Отрисовка Героев (Тевос и Малой)
        function drawHeroes() {
            // 1. Тевос (Маленький, широкий, с черной бородой)
            ctx.fillStyle = heroes.tevos.color;
            ctx.fillRect(heroes.tevos.x, heroes.tevos.y, heroes.tevos.width, heroes.tevos.height);
            // Борода
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(heroes.tevos.x + 10, heroes.tevos.y + 15, 20, 20);
            // Глаза
            ctx.fillStyle = '#fff';
            ctx.fillRect(heroes.tevos.x + 12, heroes.tevos.y + 8, 5, 5);
            ctx.fillRect(heroes.tevos.x + 23, heroes.tevos.y + 8, 5, 5);
            
            // 2. Малой (Высокий, худой)
            ctx.fillStyle = heroes.maloy.color;
            ctx.fillRect(heroes.maloy.x, heroes.maloy.y, heroes.maloy.width, heroes.maloy.height);
            // Глаза
            ctx.fillStyle = '#fff';
            ctx.fillRect(heroes.maloy.x + 8, heroes.maloy.y + 10, 5, 5);
            ctx.fillRect(heroes.maloy.x + 18, heroes.maloy.y + 10, 5, 5);

            // Индикатор активного игрока
            ctx.fillStyle = '#2ecc71';
            let active = heroes[activeHero];
            ctx.beginPath();
            ctx.moveTo(active.x + active.width/2, active.y - 15);
            ctx.lineTo(active.x + active.width/2 - 5, active.y - 25);
            ctx.lineTo(active.x + active.width/2 + 5, active.y - 25);
            ctx.fill();
        }

        // Отрисовка и логика посетителей
        function drawAndUpdateCustomers() {
            customers.forEach((customer, index) => {
                // Движение к стойке
                if (customer.state === 'walking') {
                    if (customer.x < customer.targetX) {
                        customer.x += 2;
                    } else {
                        customer.state = 'waiting';
                        customer.timer = 300; // время на ожидание
                    }
                }

                // Уход из кафе
