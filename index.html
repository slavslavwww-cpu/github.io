e; top: 15px; background: rgba(0,0,0,0.6); color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; } .recorder-controls { display: flex; gap: 20px; margin-top: 30px; } /* Симуляция FaceTime */ .facetime-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0d0d0d; z-index: 180; color: white; flex-direction: column; align-items: center; justify-content: space-between; padding: 50px 24px; animation: callFadeIn 0.4s ease; } .facetime-header { text-align: center; } .facetime-logo { font-size: 22px; color: #34c759; margin-bottom: 12px; } .facetime-avatar { width: 90px; height: 90px; border-radius: 50%; background: #2c2c2e; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: bold; margin: 0 auto 16px; box-shadow: 0 0 20px rgba(255,255,255,0.1); position: relative; } .facetime-avatar.pulse::before { content: ''; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px; border: 2px solid #34c759; border-radius: 50%; animation: avatarRingPulse 1.5s infinite; } .facetime-name { font-size: 24px; font-weight: 700; margin-bottom: 6px; } .facetime-status { font-size: 14px; color: #8e8e93; } .facetime-video-container { width: 100%; max-width: 400px; height: 260px; background: #1c1c1e; border-radius: 20px; margin: 20px 0; overflow: hidden; position: relative; display: none; } .facetime-video-container video { width: 100%; height: 100%; object-fit: cover; } .facetime-video-container .remote-video-placeholder { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: radial-gradient(#2c2c2e, #151515); flex-direction: column; gap: 12px; } .facetime-controls { display: flex; gap: 20px; align-items: center; } .call-action-btn { width: 60px; height: 60px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 22px; color: white; cursor: pointer; transition: transform 0.2s; } .call-action-btn:active { transform: scale(0.9); } .call-action-btn.decline { background: #ff3b30; } .call-action-btn.accept { background: #34c759; } .call-action-btn.secondary { background: rgba(255,255,255,0.15); font-size: 18px; } .call-action-btn.secondary:hover { background: rgba(255,255,255,0.25); } /* Анимации */ @keyframes modalZoomIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } } @keyframes bubbleSlideIn { from { transform: translateY(6px); opacity: 0; } to { transform: translateY(0); opacity: 1; } } @keyframes callFadeIn { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: scale(1); } } @keyframes avatarRingPulse { 0% { transform: scale(0.95); opacity: 0.8; } 100% { transform: scale(1.25); opacity: 0; } } .shake { animation: shakeAnim 0.4s ease; } @keyframes shakeAnim { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } } /* Лайтбокс картинок */ .lightbox-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 250; align-items: center; justify-content: center; } .lightbox-content { max-width: 90%; max-height: 80%; border-radius: 12px; } .lightbox-close { position: absolute; top: 30px; right: 30px; color: white; font-size: 32px; cursor: pointer; } /* Уведомления */ .toast-notif { position: fixed; top: 16px; right: 16px; left: 16px; background: rgba(0, 0, 0, 0.8); color: white; padding: 12px 16px; border-radius: 12px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; z-index: 300; transform: translateY(-50px); opacity: 0; transition: transform 0.3s, opacity 0.3s; } @media (min-width: 769px) { .toast-notif { left: auto; right: 24px; width: auto; max-width: 320px; } } .toast-notif.show { transform: translateY(0); opacity: 1; } /* Адаптация под Мобильные телефоны */ @media (max-width: 768px) { .sidebar { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform: translateX(-100%); } .sidebar.active { transform: translateX(0); } .chat-window { width: 100%; } } </style> </head> <body> <!-- Уведомления (Toast) --> <div id="toast" class="toast-notif"> <span id="toast-icon"><i class="fa-solid fa-check"></i></span> <span id="toast-msg">Успешно</span> </div> <!-- Окно Доступа / Регистрации имени --> <div id="pwd-overlay" class="modal-overlay"> <div class="modal-card" id="pwd-card"> <div class="modal-logo"> <i class="fa-solid fa-lock"></i> </div> <div class="modal-title">AI Index Chat</div> <div class="modal-desc">Приватная комната друзей. Пожалуйста, укажите код и представьтесь.</div> <input type="password" id="pwd-input" class="modal-input" placeholder="Пароль (по умолчанию 1234)" maxlength="8"> <input type="text" id="username-input" class="modal-input" placeholder="Ваше Имя / Никнейм" maxlength="20"> <button onclick="checkPasscodeAndRegister()" class="modal-btn">Войти в Чат</button> </div> </div> <!-- Окно Симуляции FaceTime --> <div id="facetime-overlay" class="facetime-overlay"> <div class="facetime-header"> <div class="facetime-logo"><i class="fa-solid fa-video"></i> FaceTime</div> <div id="facetime-avatar" class="facetime-avatar pulse">А</div> <div id="facetime-name" class="facetime-name">Собеседник</div> <div id="facetime-status" class="facetime-status">Вызов...</div> </div> <!-- Область Камеры FaceTime --> <div id="facetime-video-container" class="facetime-video-container"> <video id="facetime-local-video" autoplay playsinline muted></video> <div class="remote-video-placeholder"> <i class="fa-solid fa-user" style="font-size: 44px; color: #fff;"></i> <span>Канал соединен</span> </div> </div> <div class="facetime-controls"> <button id="call-decline" class="call-action-btn decline" onclick="endCall()"><i class="fa-solid fa-phone-slash"></i></button> <button id="call-accept" class="call-action-btn accept" onclick="acceptCall()"><i class="fa-solid fa-phone"></i></button> <button id="call-toggle-mic" class="call-action-btn secondary" onclick="toggleCallMic()"><i class="fa-solid fa-microphone"></i></button> <button id="call-toggle-cam" class="call-action-btn secondary" onclick="toggleCallCam()"><i class="fa-solid fa-camera"></i></button> </div> </div> <!-- Модалка Записи Видеокружка --> <div id="video-recorder-overlay" class="video-recorder-overlay"> <div class="video-recorder-circle"> <video id="recorder-preview" autoplay playsinline muted></video> <div class="recorder-timer" id="recorder-timer">00:00</div> </div> <div class="recorder-controls"> <button class="call-action-btn decline" onclick="cancelRecording()"><i class="fa-solid fa-xmark"></i></button> <button class="call-action-btn accept" id="btn-record-action" onclick="toggleRecording()"><i class="fa-solid fa-circle"></i></button> </div> </div> <!-- Просмотр фото (Lightbox) --> <div id="lightbox" class="lightbox-modal" onclick="closeLightbox()"> <span class="lightbox-close">&times;</span> <img id="lightbox-img" class="lightbox-content" src=""> </div> <!-- Основной Интерфейс --> <div class="app-container"> <!-- Боковое меню --> <aside class="sidebar" id="sidebar"> <div class="sidebar-header"> <div class="sidebar-title"> <span>AI Index Chat</span> <span class="badge-premium">Приватный</span> </div> <div class="sidebar-actions"> <button class="btn-secondary" onclick="copyInviteLink()"><i class="fa-solid fa-link"></i> Ссылка</button> <button class="btn-secondary" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i> Тема</button> </div> </div> <div class="sidebar-content"> <!-- Секция выбора/создания комнат --> <div class="section-header-row"> <div class="section-title">Список комнат / каналов</div> <button class="btn-add-section" onclick="promptCreateRoom()"><i class="fa-solid fa-plus"></i></button> </div> <div class="member-list" id="room-list"> <!-- Каналы рендерятся тут --> </div> <!-- Участники текущего чата --> <div class="section-header-row"> <div class="section-title">Кто онлайн</div> <button class="btn-add-section" onclick="promptCreateMember()"><i class="fa-solid fa-plus"></i></button> </div> <div class="member-list" id="member-list"> <!-- Участники рендерятся тут --> </div> <!-- Админка --> <div class="section-title">Администратор</div> <div class="admin-controls-box"> <div class="admin-title"> <i class="fa-solid fa-crown"></i> Безопасность комнаты </div> <div class="admin-setting-item"> <label class="admin-setting-label">Новый Пароль Входа</label> <input type="text" id="admin-pwd-input" class="admin-input" placeholder="Введите код..."> <button class="admin-btn" onclick="updatePassword()">Изменить пароль</button> </div> <div class="admin-setting-item" style="margin-top: 15px;"> <label class="admin-setting-label">Опасная Зона</label> <button class="admin-btn danger" onclick="clearChatHistory()">Очистить историю сообщений</button> </div> </div> </div> </aside> <!-- Основное Окно Чата --> <main class="chat-window"> <!-- Шапка --> <header class="chat-header"> <div class="chat-header-info"> <!-- Кнопка назад / открытия меню на мобильных --> <button class="btn-icon" onclick="toggleSidebarMobile()"><i class="fa-solid fa-bars"></i></button> <div class="avatar" id="active-chat-avatar" style="background: var(--primary-gradient); width: 42px; height: 42px;">#</div> <div> <div class="chat-header-name" id="active-chat-title">Общий чат</div> <div class="chat-header-status" id="active-chat-subtitle">Активен</div> </div> </div> <div class="chat-header-actions"> <button class="btn-icon call-btn" onclick="triggerFaceTimeCall(false)"><i class="fa-solid fa-phone"></i></button> <button class="btn-icon call-btn" onclick="triggerFaceTimeCall(true)"><i class="fa-solid fa-video"></i></button> </div> </header> <!-- История Сообщений --> <div class="messages-container" id="messages-container"> <!-- Сообщения рендерятся динамически --> </div> <!-- Превью прикрепленного файла --> <div id="attachment-preview" class="attachment-preview-bar"> <span id="attachment-name">Файл не выбран</span> <button class="btn-icon" style="width: 28px; height: 28px;" onclick="clearAttachment()"><i class="fa-solid fa-times"></i></button> </div> <!-- Строка Ввода и Действия --> <div class="chat-input-bar"> <div class="input-row"> <!-- Эмодзи/Стикер поповер кнопка --> <button class="input-action-btn" onclick="toggleEmojiPicker()"><i class="fa-solid fa-face-smile"></i></button> <!-- Прикрепить Фото/Видео --> <button class="input-action-btn" onclick="triggerMediaUpload()"><i class="fa-solid fa-plus"></i></button> <input type="file" id="media-upload-input" style="display: none;" onchange="handleMediaSelected(event)" accept="image/*,video/*"> <!-- Видеокружок (Telegram style) --> <button class="input-action-btn" onclick="startVideoCircleRecording()"><i class="fa-solid fa-circle-dot"></i></button> <!-- Поле ввода текста --> <input type="text" id="chat-input" class="chat-textbox" placeholder="iMessage" onkeydown="handleInputKeyDown(event)"> <!-- Отправить --> <button class="input-action-btn" onclick="sendMessage()"><i class="fa-solid fa-arrow-up"></i></button> </div> <!-- Поповер выбора смайлов / стикеров --> <div class="picker-popover" id="picker-popover"> <div class="picker-tabs"> <span class="picker-tab active" id="tab-emojis" onclick="switchPickerTab('emojis')">Смайлы</span> <span class="picker-tab" id="tab-stickers" onclick="switchPickerTab('stickers')">Стикеры</span> </div> <div class="picker-grid" id="picker-grid"> <!-- Смайлы --> </div> </div> </div> </main> </div> <script> // Инициализация баз данных из LocalStorage let currentPasscode = localStorage.getItem('chat_room_passcode') || '1234'; let isDarkTheme = localStorage.getItem('chat_theme') === 'dark'; // Хранение данных чатов let activeRoomId = localStorage.getItem('active_room_id') || 'general'; let rooms = JSON.parse(localStorage.getItem('chat_rooms')) || [ { id: 'general', name: 'Общий чат', icon: '💬' }, { id: 'developers', name: 'Разработка', icon: '💻' } ]; let messages = JSON.parse(localStorage.getItem('chat_messages_v2')) || []; let customMembers = JSON.parse(localStorage.getItem('chat_custom_members')) || []; let currentUser = localStorage.getItem('current_user_name') || ''; // Синтезатор звука (Web Audio API) const audioCtx = new (window.AudioContext || window.webkitAudioContext)(); function playSystemSound(type) { try { if (audioCtx.state === 'suspended') { audioCtx.resume(); } const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain(); osc.connect(gainNode); gainNode.connect(audioCtx.destination); if (type === 'sent') { osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1440, audioCtx.currentTime + 0.15); gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15); osc.start(); osc.stop(audioCtx.currentTime + 0.15); } else if (type === 'received') { osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime); osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.08); gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2); } else if (type === 'ringing') { osc.type = 'triangle'; osc.frequency.setValueAtTime(440, audioCtx.currentTime); osc.frequency.setValueAtTime(480, audioCtx.currentTime + 0.05); gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2); osc.start(); osc.stop(audioCtx.currentTime + 1.2); } } catch (e) { console.warn("Audio Context error:", e); } } const popularEmojis = [ '😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😙','😚', '😋','😛','😝','😜','🤪','🤨','🧐','🤓','😎','🥸','🤩','🥳','😏','😒','😞','😔','😟','😕','🙁','☹️', '🥺','😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥','😓','🤗','🤔','🫣','🤭' ]; const cuteStickers = [ '🐱', '🐶', '🦄', '🦁', '🦊', '🐼', '🐨', '🦖', '🐉', '🐙', '👾', '🚀', '🔮', '✨', '🍕', '🍩' ]; let currentSelectedSenderId = 'me'; // По умолчанию 'me' (Вы) let currentPickerTab = 'emojis'; let pendingMediaBase64 = null; let pendingMediaType = null; // Инициализация при загрузке window.addEventListener('load', () => { if (isDarkTheme) { document.body.classList.add('dark-theme'); } // Проверка авторизации if (sessionStorage.getItem('access_granted') === 'true' && currentUser) { document.getElementById('pwd-overlay').style.display = 'none'; setupSessionUser(); } else { // Очистим имя если сессии нет currentUser = ''; } renderRooms(); renderMembers(); renderChatMessages(); }); function checkPasscodeAndRegister() { const pwdVal = document.getElementById('pwd-input').value; const nameVal = document.getElementById('username-input').value.trim(); if (pwdVal !== currentPasscode) { shakeModal(); showToast('Неверный код доступа', 'error'); return; } if (!nameVal) { shakeModal(); showToast('Пожалуйста, введите свое имя', 'error'); return; } currentUser = nameVal; localStorage.setItem('current_user_name', nameVal); sessionStorage.setItem('access_granted', 'true'); setupSessionUser(); // Скрытие оверлея входа const overlay = document.getElementById('pwd-overlay'); overlay.style.opacity = '0'; setTimeout(() => overlay.style.display = 'none', 400); showToast('Успешный вход!', 'success'); } // Тема function toggleTheme() { document.body.classList.toggle('dark-theme'); const darkActive = document.body.classList.contains('dark-theme'); localStorage.setItem('chat_theme', darkActive ? 'dark' : 'light'); } // Копирование инвайт-ссылки function copyInviteLink() { const shareUrl = window.location.href; navigator.clipboard.writeText(shareUrl).then(() => { showToast('Ссылка скопирована в буфер обмена!', 'success'); }).catch(err => { showToast('Не удалось скопировать', 'error'); }); } // Создание новой комнаты function promptCreateRoom() { const name = prompt("Введите название новой комнаты:"); if (!name) return; const id = 'room-' + Date.now(); rooms.push({ id, name, icon: '💬' }); localStorage.setItem('chat_rooms', JSON.stringify(rooms)); renderRooms(); selectRoom(id); showToast(`Комната "${name}" создана!`, 'success'); } // Рендер комнат в сайдбаре function renderRooms() { const container = document.getElementById('room-list'); container.innerHTML = ''; rooms.forEach(r => { const item = document.createElement('div'); item.className = `member-item ${r.id === activeRoomId ? 'active' : ''}`; item.onclick = () => selectRoom(r.id); item.innerHTML = ` <div class="avatar-wrapper"> <div class="avatar" style="background-color: var(--primary-color);"> ${r.icon} </div> </div> <div class="member-info"> <div class="member-name-row"> <span class="member-name">${r.name}</span> </div> <div class="member-preview">Канал общения</div> </div> `; container.appendChild(item); }); } function selectRoom(id) { activeRoomId = id; localStorage.setItem('active_room_id', id); renderRooms(); const r = rooms.find(room => room.id === id); if (r) { document.getElementById('active-chat-title').innerText = r.name; document.getElementById('active-chat-avatar').innerText = r.icon; } renderChatMessages(); } // Создание кастомного собеседника function promptCreateMember() { const name = prompt("Введите имя нового собеседника:"); if (!name) return; const id = 'user-' + Date.now(); const colors = ['#34c759', '#ff9500', '#ff2d55', '#5856d6', '#af52de', '#ff3b30']; const randomColor = colors[Math.floor(Math.random() * colors.length)]; customMembers.push({ id, name, color: randomColor, status: 'online', admin: false }); localStorage.setItem('chat_custom_members', JSON.stringify(customMembers)); renderMembers(); showToast(`Собеседник ${name} добавлен в комнату!`, 'success'); } // Список участников function renderMembers() { const container = document.getElementById('member-list'); container.innerHTML = ''; // Если массив кастомных участников пуст, добавим дефолтных if (customMembers.length === 0) { customMembers = [ { id: 'me', name: currentUser || 'Вы', color: '#007aff', status: 'online', admin: true }, { id: 'alex', name: 'Александр', color: '#ff9500', status: 'online', admin: false }, { id: 'sophie', name: 'София', color: '#ff2d55', status: 'online', admin: false } ]; localStorage.setItem('chat_custom_members', JSON.stringify(customMembers)); } customMembers.forEach(m => { const item = document.createElement('div'); item.className = `member-item ${m.id === currentSelectedSenderId ? 'active' : ''}`; item.onclick = () => selectSender(m.id); item.innerHTML = ` <div class="avatar-wrapper"> <div class="avatar" style="background-color: ${m.color};"> ${m.name[0]} </div> <div class="status-dot ${m.status === 'offline' ? 'offline' : ''}"></div> </div> <div class="member-info"> <div class="member-name-row"> <span class="member-name">${m.name}</span> ${m.admin ? '<span class="badge-admin"><i class="fa-solid fa-crown"></i> Админ</span>' : ''} </div> <div class="member-preview">${m.id === 'me' ? 'Вы отправляете как...' : 'Переключить автора'}</div> </div> `; container.appendChild(item); }); } function selectSender(id) { currentSelectedSenderId = id; renderMembers(); const s = customMembers.find(m => m.id === id); if (s) { showToast(`Пишем от имени: ${s.name}`, 'info'); } } // Отрисовка Истории Сообщений function renderChatMessages() { const container = document.getElementById('messages-container'); container.innerHTML = ''; const activeRoomMessages = messages.filter(m => m.roomId === activeRoomId); if (activeRoomMessages.length === 0) { container.innerHTML = ` <div style="text-align: center; color: var(--text-secondary-light); margin-top: 50px; font-size: 13px;"> <i class="fa-solid fa-comment-dots" style="font-size: 32px; display: block; margin-bottom: 12px; color: var(--primary-color);"></i> Сообщений нет. Напишите что-нибудь первое в эту комнату! </div> `; return; } activeRoomMessages.forEach(msg => { const row = document.createElement('div'); const isOutgoing = msg.senderId === 'me'; row.className = `message-row ${isOutgoing ? 'outgoing' : 'incoming'}`; const sender = customMembers.find(m => m.id === msg.senderId) || { name: msg.senderName || 'Участник', color: '#999' }; let bubbleContent = ''; let bubbleClass = 'message-bubble'; if (msg.type === 'text') { bubbleContent = linkify(escapeHtml(msg.content)); } else if (msg.type === 'sticker') { bubbleClass += ' sticker'; bubbleContent = msg.content; } else if (msg.type === 'large-emoji') { bubbleClass += ' large-emoji'; bubbleContent = msg.content; } else if (msg.type === 'image') { bubbleContent = `<img src="${msg.content}" class="message-image" onclick="zoomImage('${msg.content}')" alt="Картинка">`; } else if (msg.type === 'video') { bubbleContent = ` <video class="message-image" controls> <source src="${msg.content}"> Ваш браузер не поддерживает видео. </video> `; } else if (msg.type === 'video-circle') { bubbleContent = ` <div class="video-circle-message"> <video id="video-${msg.id}" loop playsinline> <source src="${msg.content}"> </video> <div class="play-overlay" onclick="togglePlayVideoCircle('video-${msg.id}')"> <i class="fa-solid fa-play"></i> </div> </div> `; } row.innerHTML = ` <div class="avatar-wrapper" style="${isOutgoing ? 'display: none;' : ''}"> <div class="avatar" style="background-color: ${sender.color}; width: 34px; height: 34px; font-size: 13px;"> ${sender.name[0]} </div> </div> <div> ${!isOutgoing ? `<div class="message-sender">${sender.name}</div>` : ''} <div style="display: flex; gap: 8px; flex-direction: ${isOutgoing ? 'row-reverse' : 'row'};"> <div class="${bubbleClass}"> ${bubbleContent} </div> <span class="message-time">${formatTime(msg.timestamp)}</span> </div> </div> `; container.appendChild(row); }); container.scrollTop = container.scrollHeight; } // Воспроизведение кружка function togglePlayVideoCircle(elemId) { const v = document.getElementById(elemId); if (!v) return; const playBtn = v.nextElementSibling.querySelector('i'); if (v.paused) { v.play(); playBtn.className = "fa-solid fa-pause"; } else { v.pause(); playBtn.className = "fa-solid fa-play"; } } // Выбор медиа файла function triggerMediaUpload() { document.getElementById('media-upload-input').click(); } function handleMediaSelected(event) { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = function(e) { pendingMediaBase64 = e.target.result; pendingMediaType = file.type.startsWith('video/') ? 'video' : 'image'; const bar = document.getElementById('attachment-preview'); bar.style.display = 'flex'; document.getElementById('attachment-name').innerText = `Файл выбран: ${file.name} (${Math.round(file.size / 1024)} КБ)`; } reader.readAsDataURL(file); } function clearAttachment() { pendingMediaBase64 = null; pendingMediaType = null; document.getElementById('media-upload-input').value = ''; document.getElementById('attachment-preview').style.display = 'none'; } // Отправка сообщений function sendMessage() { const textInput = document.getElementById('chat-input'); const text = textInput.value.trim(); if (!text && !pendingMediaBase64) return; const senderObj = customMembers.find(m => m.id === currentSelectedSenderId) || { name: currentUser, color: '#007aff' }; let msg = { id: 'msg-' + Date.now(), roomId: activeRoomId, senderId: currentSelectedSenderId, senderName: senderObj.name, timestamp: Date.now() }; if (pendingMediaBase64) { msg.type = pendingMediaType; msg.content = pendingMediaBase64; clearAttachment(); } else { if (isOnlyEmoji(text)) { msg.type = 'large-emoji'; msg.content = text; } else { msg.type = 'text'; msg.content = text; } } messages.push(msg); saveDatabase(); textInput.value = ''; playSystemSound('sent'); renderChatMessages(); } function saveDatabase() { localStorage.setItem('chat_messages_v2', JSON.stringify(messages)); } function isOnlyEmoji(str) { const regex = /^\p{Emoji}$/u; return regex.test(str); } function escapeHtml(text) { return text .replace(/&/g, "&amp;") .replace(/</g, "&lt;") .replace(/>/g, "&gt;") .replace(/"/g, "&quot;") .replace(/'/g, "&#039;"); } function linkify(text) { const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig; return text.replace(urlPattern, '<a href="$1" target="_blank" style="color: inherit; text-decoration: underline;">$1</a>'); } function formatTime(timestamp) { const date = new Date(timestamp); let h = date.getHours(); let m = date.getMinutes(); h = h < 10 ? '0' + h : h; m = m < 10 ? '0' + m : m; return `${h}:${m}`; } function handleInputKeyDown(e) { if (e.key === 'Enter') { sendMessage(); } } // Выбор Эмодзи / Стикеров function toggleEmojiPicker() { const popover = document.getElementById('picker-popover'); if (popover.style.display === 'block') { popover.style.display = 'none'; } else { popover.style.display = 'block'; renderPickerContent(); } } function switchPickerTab(tab) { currentPickerTab = tab; document.getElementById('tab-emojis').className = tab === 'emojis' ? 'picker-tab active' : 'picker-tab'; document.getElementById('tab-stickers').className = tab === 'stickers' ? 'picker-tab active' : 'picker-tab'; renderPickerContent(); } function renderPickerContent() { const grid = document.getElementById('picker-grid'); grid.innerHTML = ''; const list = currentPickerTab === 'emojis' ? popularEmojis : cuteStickers; list.forEach(item => { const span = document.createElement('span'); span.className = 'picker-item'; span.innerText = item; span.onclick = () => selectPickerItem(item, currentPickerTab); grid.appendChild(span); }); } function selectPickerItem(val, type) { if (type === 'emojis') { const input = document.getElementById('chat-input'); input.value += val; input.focus(); } else { const senderObj = customMembers.find(m => m.id === currentSelectedSenderId) || { name: currentUser, color: '#007aff' }; // Отправка Стикеров const msg = { id: 'msg-' + Date.now(), roomId: activeRoomId, senderId: currentSelectedSenderId, senderName: senderObj.name, type: 'sticker', content: val, timestamp: Date.now() }; messages.push(msg); saveDatabase(); playSystemSound('sent'); renderChatMessages(); } document.getElementById('picker-popover').style.display = 'none'; } // Видеокружки (Запись с вебкамеры или Симуляция) let mediaRecorder = null; let recordedChunks = []; let streamRef = null; let recordTimerInterval = null; function startVideoCircleRecording() { const overlay = document.getElementById('video-recorder-overlay'); overlay.style.display = 'flex'; recordedChunks = []; navigator.mediaDevices.getUserMedia({ video: { width: 300, height: 300, facingMode: 'user' }, audio: true }) .then(stream => { streamRef = stream; const videoElement = document.getElementById('recorder-preview'); videoElement.srcObject = stream; videoElement.play(); const btn = document.getElementById('btn-record-action'); btn.innerHTML = '<i class="fa-solid fa-circle"></i>'; btn.className = 'call-action-btn accept'; }) .catch(err => { console.warn("Camera blocked, using fallback animation", err); showToast("Камера заблокирована или недоступна. Используется симуляция кружка!", "info"); simulateCircularVideoFallback(); }); } function toggleRecording() { const btn = document.getElementById('btn-record-action'); if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); btn.innerHTML = '<i class="fa-solid fa-circle"></i>'; btn.className = 'call-action-btn accept'; clearInterval(recordTimerInterval); } else { if (!streamRef) return; recordedChunks = []; mediaRecorder = new MediaRecorder(streamRef); mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); }; mediaRecorder.onstop = () => { const blob = new Blob(recordedChunks, { type: 'video/webm' }); const reader = new FileReader(); reader.onload = (e) => { const senderObj = customMembers.find(m => m.id === currentSelectedSenderId) || { name: currentUser, color: '#007aff' }; const msg = { id: 'msg-' + Date.now(), roomId: activeRoomId, senderId: currentSelectedSenderId, senderName: senderObj.name, type: 'video-circle', content: e.target.result, timestamp: Date.now() }; messages.push(msg); saveDatabase(); playSystemSound('sent'); renderChatMessages(); closeVideoRecorder(); }; reader.readAsDataURL(blob); }; mediaRecorder.start(); btn.innerHTML = '<i class="fa-solid fa-square"></i>'; btn.className = 'call-action-btn decline'; let seconds = 0; document.getElementById('recorder-timer').innerText = "00:00"; recordTimerInterval = setInterval(() => { seconds++; let m = Math.floor(seconds / 60); let s = seconds % 60; document.getElementById('recorder-timer').innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`; }, 1000); } } function cancelRecording() { closeVideoRecorder(); } function closeVideoRecorder() { clearInterval(recordTimerInterval); if (streamRef) { streamRef.getTracks().forEach(track => track.stop()); } document.getElementById('video-recorder-overlay').style.display = 'none'; } function simulateCircularVideoFallback() { closeVideoRecorder(); const sampleCircleUrl = "https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-background-1611-large.mp4"; const senderObj = customMembers.find(m => m.id === currentSelectedSenderId) || { name: currentUser, color: '#007aff' }; const msg = { id: 'msg-' + Date.now(), roomId: activeRoomId, senderId: currentSelectedSenderId, senderName: senderObj.name, type: 'video-circle', content: sampleCircleUrl, timestamp: Date.now() }; messages.push(msg); saveDatabase(); playSystemSound('sent'); renderChatMessages(); } // Фото-лайтбокс function zoomImage(src) { document.getElementById('lightbox-img').src = src; document.getElementById('lightbox').style.display = 'flex'; } function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; } // FaceTime Симулятор let facetimeRingInterval = null; let localStreamRef = null; function triggerFaceTimeCall(isVideo) { const overlay = document.getElementById('facetime-overlay'); overlay.style.display = 'flex'; const s = customMembers.find(m => m.id === currentSelectedSenderId) || { name: 'Собеседник' }; document.getElementById('facetime-avatar').innerText = s.name[0]; document.getElementById('facetime-name').innerText = s.name; const acceptBtn = document.getElementById('call-accept'); navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true }) .then(stream => { localStreamRef = stream; document.getElementById('facetime-local-video').srcObject = stream; }).catch(err => console.warn("Камера занята. Симуляция аудиовызова.", err)); document.getElementById('facetime-status').innerText = isVideo ? "Вызываю на FaceTime-Видео..." : "Вызываю на FaceTime-Аудио..."; acceptBtn.style.display = 'none'; facetimeRingInterval = setInterval(() => playSystemSound('ringing'), 1500); // Авто-ответ через 2.5 сек в симуляции setTimeout(() => { acceptCall(); }, 2500); } function acceptCall() { clearInterval(facetimeRingInterval); document.getElementById('facetime-status').innerText = "Соединение установлено"; document.getElementById('call-accept').style.display = 'none'; document.getElementById('facetime-video-container').style.display = 'block'; showToast("Звонок соединен!", "success"); } function endCall() { clearInterval(facetimeRingInterval); if (localStreamRef) { localStreamRef.getTracks().forEach(track => track.stop()); } document.getElementById('facetime-video-container').style.display = 'none'; document.getElementById('facetime-overlay').style.display = 'none'; showToast("Звонок завершен", "info"); } function toggleCallMic() { showToast("Микрофон переключен", "info"); } function toggleCallCam() { showToast("Камера переключена", "info"); } // Пароль & Настройки function updatePassword() { const input = document.getElementById('admin-pwd-input'); const val = input.value.trim(); if (!val) { showToast("Введите валидный код доступа", "error"); return; } currentPasscode = val; localStorage.setItem('chat_room_passcode', val); input.value = ''; showToast("Пароль обновлен!", "success"); } function clearChatHistory() { if (confirm("Вы действительно хотите удалить все сообщения чата?")) { messages = []; saveDatabase(); renderChatMessages(); showToast("История сообщений очищена!", "success"); } } // Система Toast уведомлений function showToast(message, type = 'success') { const toast = document.getElementById('toast'); const msgSpan = document.getElementById('toast-msg'); const iconSpan = document.getElementById('toast-icon'); msgSpan.innerText = message; if (type === 'success') { iconSpan.innerHTML = '<i class="fa-solid fa-circle-check" style="color: #34c759;"></i>'; } else if (type === 'error') { iconSpan.innerHTML = '<i class="fa-solid fa-circle-exclamation" style="color: #ff3b30;"></i>'; } else { iconSpan.innerHTML = '<i class="fa-solid fa-info-circle" style="color: #007aff;"></i>'; } toast.className = "toast-notif show"; setTimeout(() => { toast.className = "toast-notif"; }, 3000); } // Слайдер бокового меню (мобильные) function toggleSidebarMobile() { const sidebar = document.getElementById('sidebar'); sidebar.classList.toggle('active'); } </script> </body> </html>
