<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Index Chat — Private Friends Room</title>
  <!-- Apple SF Pro Font Style Fallbacks and Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Reset & CSS Variables */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --primary-color: #007aff;
      --primary-gradient: linear-gradient(135deg, #007aff, #0051af);
      --bg-light: #f2f2f7;
      --bg-dark: #000000;
      --sidebar-light: rgba(245, 245, 247, 0.75);
      --sidebar-dark: rgba(22, 22, 23, 0.75);
      --chat-light: rgba(255, 255, 255, 0.65);
      --chat-dark: rgba(28, 28, 30, 0.65);
      --border-light: rgba(0, 0, 0, 0.1);
      --border-dark: rgba(255, 255, 255, 0.1);
      --text-light: #1d1d1f;
      --text-dark: #f5f5f7;
      --text-secondary-light: #86868b;
      --text-secondary-dark: #8e8e93;
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.08);
      --ios-bubble-incoming-light: #e9e9eb;
      --ios-bubble-incoming-dark: #262629;
      --ios-bubble-outgoing: #007aff;
      --transition-speed: 0.3s;
    }

    body {
      background: radial-gradient(circle at 50% 50%, #e2e8f0, #cbd5e1);
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      transition: background var(--transition-speed) ease;
    }

    body.dark-theme {
      background: radial-gradient(circle at 50% 50%, #1c1c1e, #000000);
      color: var(--text-dark);
    }

    /* Glass Container */
    .app-container {
      width: 95vw;
      height: 90vh;
      max-width: 1200px;
      max-height: 850px;
      background: var(--chat-light);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-light);
      border-radius: 24px;
      box-shadow: var(--glass-shadow);
      display: flex;
      overflow: hidden;
      position: relative;
      transition: background var(--transition-speed) ease, border-color var(--transition-speed) ease;
    }

    body.dark-theme .app-container {
      background: var(--chat-dark);
      border-color: var(--border-dark);
    }

    /* Sidebar Styles */
    .sidebar {
      width: 320px;
      background: var(--sidebar-light);
      border-right: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background var(--transition-speed) ease, border-color var(--transition-speed) ease, transform var(--transition-speed) ease;
      z-index: 10;
    }

    body.dark-theme .sidebar {
      background: var(--sidebar-dark);
      border-color: var(--border-dark);
    }

    .sidebar-header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid var(--border-light);
    }

    body.dark-theme .sidebar-header {
      border-color: var(--border-dark);
    }

    .sidebar-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge-premium {
      background: var(--primary-gradient);
      color: white;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sidebar-actions {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: none;
      background: rgba(0, 0, 0, 0.05);
      color: var(--text-light);
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s, transform 0.1s;
    }

    body.dark-theme .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-dark);
    }

    .btn-secondary:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    body.dark-theme .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-secondary:active {
      transform: scale(0.97);
    }

    /* List sections inside sidebar */
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-secondary-light);
      padding-left: 8px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    body.dark-theme .section-title {
      color: var(--text-secondary-dark);
    }

    /* Members and Contacts */
    .member-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 24px;
    }

    .member-item {
      display: flex;
      align-items: center;
      padding: 10px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s;
      position: relative;
    }

    .member-item:hover {
      background: rgba(0, 0, 0, 0.03);
    }

    body.dark-theme .member-item:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .member-item.active {
      background: rgba(0, 122, 255, 0.12);
    }

    body.dark-theme .member-item.active {
      background: rgba(0, 122, 255, 0.2);
    }

    .avatar-wrapper {
      position: relative;
      margin-right: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 15px;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.1);
    }

    .status-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background-color: #34c759;
      position: absolute;
      bottom: 0;
      right: 0;
      border: 2px solid #ffffff;
    }

    body.dark-theme .status-dot {
      border-color: #1c1c1e;
    }

    .status-dot.offline {
      background-color: #8e8e93;
    }

    .member-info {
      flex: 1;
      min-width: 0;
    }

    .member-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .member-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-admin {
      background: rgba(255, 149, 0, 0.15);
      color: #ff9500;
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 6px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    body.dark-theme .badge-admin {
      background: rgba(255, 149, 0, 0.25);
    }

    .member-preview {
      font-size: 12px;
      color: var(--text-secondary-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    body.dark-theme .member-preview {
      color: var(--text-secondary-dark);
    }

    /* Admin Options Box */
    .admin-controls-box {
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 14px;
      margin-top: 10px;
    }

    body.dark-theme .admin-controls-box {
      background: rgba(0, 0, 0, 0.2);
      border-color: var(--border-dark);
    }

    .admin-title {
      font-size: 13px;
      font-weight: 700;
      color: #ff9500;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .admin-setting-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .admin-setting-item:last-child {
      margin-bottom: 0;
    }

    .admin-setting-label {
      font-size: 12px;
      font-weight: 500;
    }

    .admin-input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-light);
      background: rgba(255, 255, 255, 0.7);
      color: var(--text-light);
      font-size: 12px;
      outline: none;
    }

    body.dark-theme .admin-input {
      border-color: var(--border-dark);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text-dark);
    }

    .admin-input:focus {
      border-color: var(--primary-color);
    }

    .admin-btn {
      width: 100%;
      padding: 8px;
      background: var(--primary-gradient);
      border: none;
      color: white;
      font-weight: 600;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .admin-btn.danger {
      background: linear-gradient(135deg, #ff3b30, #ff453a);
    }

    .admin-btn:hover {
      opacity: 0.9;
    }

    /* Main Chat Section */
    .chat-window {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.45);
      position: relative;
    }

    body.dark-theme .chat-window {
      background: rgba(18, 18, 18, 0.45);
    }

    /* Header */
    .chat-header {
      height: 70px;
      padding: 0 24px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 5;
    }

    body.dark-theme .chat-header {
      border-color: var(--border-dark);
      background: rgba(30, 30, 30, 0.5);
    }

    .chat-header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header-name {
      font-size: 16px;
      font-weight: 600;
    }

    .chat-header-status {
      font-size: 12px;
      color: var(--text-secondary-light);
    }

    body.dark-theme .chat-header-status {
      color: var(--text-secondary-dark);
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.05);
      color: var(--primary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s, transform 0.1s;
    }

    body.dark-theme .btn-icon {
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-icon:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    body.dark-theme .btn-icon:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-icon:active {
      transform: scale(0.95);
    }

    .btn-icon.call-btn {
      background: #34c759;
      color: white;
    }

    .btn-icon.call-btn:hover {
      background: #28a745;
    }

    /* Messages Area */
    .messages-container {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    /* Custom Scrollbar */
    .messages-container::-webkit-scrollbar,
    .sidebar-content::-webkit-scrollbar {
      width: 6px;
    }
    .messages-container::-webkit-scrollbar-thumb,
    .sidebar-content::-webkit-scrollbar-thumb {
      background-color: rgba(0,0,0,0.15);
      border-radius: 4px;
    }
    body.dark-theme .messages-container::-webkit-scrollbar-thumb,
    body.dark-theme .sidebar-content::-webkit-scrollbar-thumb {
      background-color: rgba(255,255,255,0.15);
    }

    /* Message Bubbles - iMessage precise styling */
    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 75%;
      margin-bottom: 4px;
      animation: bubbleSlideIn 0.3s cubic-bezier(0.1, 0.8, 0.25, 1);
    }

    .message-row.outgoing {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-row.incoming {
      align-self: flex-start;
    }

    .message-sender {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary-light);
      margin-bottom: 2px;
      margin-left: 52px;
    }

    body.dark-theme .message-sender {
      color: var(--text-secondary-dark);
    }

    .message-row.outgoing + .message-sender {
      display: none; /* Hide sender tag for outgoing */
    }

    .message-bubble {
      padding: 10px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
      word-break: break-word;
    }

    .message-row.incoming .message-bubble {
      background-color: var(--ios-bubble-incoming-light);
      color: var(--text-light);
      border-bottom-left-radius: 4px;
    }

    body.dark-theme .message-row.incoming .message-bubble {
      background-color: var(--ios-bubble-incoming-dark);
      color: var(--text-dark);
    }

    .message-row.outgoing .message-bubble {
      background: var(--primary-gradient);
      color: white;
      border-bottom-right-radius: 4px;
    }

    /* Non-bubble types: stickers, large emojis, video circles */
    .message-bubble.sticker,
    .message-bubble.large-emoji {
      background: transparent !important;
      padding: 0;
      box-shadow: none !important;
      font-size: 64px;
      line-height: 1;
    }

    .message-bubble img.message-image {
      max-width: 250px;
      border-radius: 12px;
      cursor: zoom-in;
      transition: transform 0.2s;
    }

    .message-bubble img.message-image:hover {
      transform: scale(1.02);
    }

    /* Video Circle styling */
    .video-circle-message {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--primary-color);
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      position: relative;
      background: #000;
    }

    .video-circle-message video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-circle-message .play-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .video-circle-message:hover .play-overlay {
      opacity: 1;
    }

    /* Time tag */
    .message-time {
      font-size: 10px;
      color: var(--text-secondary-light);
      margin-top: 4px;
      align-self: flex-end;
    }

    body.dark-theme .message-time {
      color: var(--text-secondary-dark);
    }

    .message-row.outgoing .message-time {
      align-self: flex-start;
    }

    /* Input Bar Panel */
    .chat-input-bar {
      padding: 16px 24px;
      border-top: 1px solid var(--border-light);
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    body.dark-theme .chat-input-bar {
      border-color: var(--border-dark);
      background: rgba(30, 30, 30, 0.55);
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .chat-textbox {
      flex: 1;
      border-radius: 20px;
      border: 1px solid var(--border-light);
      padding: 10px 45px 10px 16px;
      background: rgba(255, 255, 255, 0.8);
      color: var(--text-light);
      outline: none;
      font-size: 14px;
      resize: none;
      height: 40px;
      line-height: 20px;
      max-height: 100px;
      transition: border-color 0.2s;
    }

    body.dark-theme .chat-textbox {
      border-color: var(--border-dark);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text-dark);
    }

    .chat-textbox:focus {
      border-color: var(--primary-color);
    }

    .input-action-btn {
      color: var(--primary-color);
      font-size: 20px;
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
    }

    .input-action-btn:hover {
      background: rgba(0, 122, 255, 0.1);
    }

    .input-action-btn:active {
      transform: scale(0.9);
    }

    /* Floating send icon inside input */
    .btn-send-inside {
      position: absolute;
      right: 56px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary-color);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    /* Pickers Container */
    .picker-popover {
      display: none;
      position: absolute;
      bottom: 75px;
      left: 24px;
      background: var(--chat-light);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border-light);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      z-index: 20;
      padding: 16px;
      width: 320px;
    }

    body.dark-theme .picker-popover {
      background: var(--chat-dark);
      border-color: var(--border-dark);
    }

    .picker-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 12px;
      padding-bottom: 6px;
    }

    body.dark-theme .picker-tabs {
      border-color: var(--border-dark);
    }

    .picker-tab {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary-light);
      cursor: pointer;
      padding: 6px 0;
    }

    body.dark-theme .picker-tab {
      color: var(--text-secondary-dark);
    }

    .picker-tab.active {
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
    }

    .picker-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      max-height: 200px;
      overflow-y: auto;
    }

    .picker-item {
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .picker-item:hover {
      transform: scale(1.2);
    }

    /* Attachment Preview Bar */
    .attachment-preview-bar {
      display: none;
      padding: 8px 12px;
      background: rgba(0,0,0,0.05);
      border-radius: 12px;
      align-items: center;
      justify-content: space-between;
    }

    body.dark-theme .attachment-preview-bar {
      background: rgba(255,255,255,0.05);
    }

    /* Modal Styling - Password Protection */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    .modal-card {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 24px;
      padding: 35px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      text-align: center;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      animation: modalZoomIn 0.4s cubic-bezier(0.1, 0.8, 0.25, 1);
    }

    body.dark-theme .modal-card {
      background: rgba(28, 28, 30, 0.8);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .modal-logo {
      font-size: 50px;
      color: var(--primary-color);
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 13px;
      color: var(--text-secondary-light);
      margin-bottom: 24px;
    }

    body.dark-theme .modal-desc {
      color: var(--text-secondary-dark);
    }

    .modal-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid var(--border-light);
      background: rgba(255, 255, 255, 0.6);
      color: var(--text-light);
      font-size: 16px;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      margin-bottom: 20px;
    }

    body.dark-theme .modal-input {
      border-color: var(--border-dark);
      background: rgba(0, 0, 0, 0.4);
      color: var(--text-dark);
    }

    .modal-input:focus {
      border-color: var(--primary-color);
    }

    .modal-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: var(--primary-gradient);
      color: white;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .modal-btn:hover {
      opacity: 0.9;
    }

    /* Video recording circle overlay modal */
    .video-recorder-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 90;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .video-recorder-circle {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      overflow: hidden;
      border: 5px solid #ff3b30;
      position: relative;
      background: #000;
      box-shadow: 0 0 30px rgba(255, 59, 48, 0.5);
    }

    .video-recorder-circle video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .recorder-timer {
      position: absolute;
      top: 20px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .recorder-controls {
      display: flex;
      gap: 20px;
      margin-top: 30px;
    }

    /* FaceTime Call Simulator View overlay */
    .facetime-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0d0d0d;
      z-index: 110;
      color: white;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 60px 24px;
      animation: callFadeIn 0.4s ease;
    }

    .facetime-header {
      text-align: center;
    }

    .facetime-logo {
      font-size: 24px;
      color: #34c759;
      margin-bottom: 15px;
    }

    .facetime-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #2c2c2e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: bold;
      margin: 0 auto 16px;
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
      position: relative;
    }

    .facetime-avatar.pulse::before {
      content: '';
      position: absolute;
      top: -10px; left: -10px; right: -10px; bottom: -10px;
      border: 2px solid #34c759;
      border-radius: 50%;
      animation: avatarRingPulse 1.5s infinite;
    }

    .facetime-name {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .facetime-status {
      font-size: 14px;
      color: #8e8e93;
    }

    .facetime-video-container {
      width: 100%;
      max-width: 450px;
      height: 300px;
      background: #1c1c1e;
      border-radius: 20px;
      margin: 20px 0;
      overflow: hidden;
      position: relative;
      display: none;
    }

    .facetime-video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .facetime-video-container .remote-video-placeholder {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(#2c2c2e, #151515);
      flex-direction: column;
      gap: 15px;
    }

    .facetime-controls {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .call-action-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: white;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .call-action-btn:active {
      transform: scale(0.9);
    }

    .call-action-btn.decline {
      background: #ff3b30;
    }

    .call-action-btn.accept {
      background: #34c759;
    }

    .call-action-btn.secondary {
      background: rgba(255,255,255,0.15);
      font-size: 20px;
    }

    .call-action-btn.secondary:hover {
      background: rgba(255,255,255,0.25);
    }

    /* Keyframes */
    @keyframes modalZoomIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes bubbleSlideIn {
      from { transform: translateY(8px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes callFadeIn {
      from { opacity: 0; transform: scale(1.05); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes avatarRingPulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.25); opacity: 0; }
    }

    .shake {
      animation: shakeAnim 0.4s ease;
    }

    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    /* Lightbox Modal */
    .lightbox-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 150;
      align-items: center;
      justify-content: center;
    }

    .lightbox-content {
      max-width: 90%;
      max-height: 80%;
      border-radius: 12px;
    }

    .lightbox-close {
      position: absolute;
      top: 30px;
      right: 30px;
      color: white;
      font-size: 32px;
      cursor: pointer;
    }

    /* Toast Notification */
    .toast-notif {
      position: fixed;
      top: 24px;
      right: 24px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 200;
      transform: translateY(-50px);
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
    }

    .toast-notif.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Mobile Responsive Toggles */
    .mobile-back-btn {
      display: none;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 100%;
        transform: translateX(0);
      }
      .sidebar.hidden {
        transform: translateX(-100%);
      }
      .chat-window {
        width: 100%;
      }
      .mobile-back-btn {
        display: flex;
        align-items: center;
        margin-right: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Toast system -->
  <div id="toast" class="toast-notif">
    <span id="toast-icon"><i class="fa-solid fa-check"></i></span>
    <span id="toast-msg">Success</span>
  </div>

  <!-- Password Access Control -->
  <div id="pwd-overlay" class="modal-overlay">
    <div class="modal-card" id="pwd-card">
      <div class="modal-logo">
        <i class="fa-solid fa-lock"></i>
      </div>
      <div class="modal-title">AI Index Chat</div>
      <div class="modal-desc">This is a private friends room. Please enter the passcode to access.</div>
      <input type="password" id="pwd-input" class="modal-input" placeholder="••••" maxlength="8">
      <button onclick="checkPasscode()" class="modal-btn">Access Room</button>
    </div>
  </div>

  <!-- FaceTime Overlay -->
  <div id="facetime-overlay" class="facetime-overlay">
    <div class="facetime-header">
      <div class="facetime-logo"><i class="fa-solid fa-video"></i> FaceTime</div>
      <div id="facetime-avatar" class="facetime-avatar pulse">A</div>
      <div id="facetime-name" class="facetime-name">Alex</div>
      <div id="facetime-status" class="facetime-status">Calling...</div>
    </div>

    <!-- Video Element (used if call connected) -->
    <div id="facetime-video-container" class="facetime-video-container">
      <video id="facetime-local-video" autoplay playsinline muted></video>
      <div class="remote-video-placeholder">
        <i class="fa-solid fa-user-astronaut" style="font-size: 48px;"></i>
        <span>Remote Stream Active</span>
      </div>
    </div>

    <div class="facetime-controls">
      <!-- Call simulation buttons -->
      <button id="call-decline" class="call-action-btn decline" onclick="endCall()"><i class="fa-solid fa-phone-slash"></i></button>
      <button id="call-accept" class="call-action-btn accept" onclick="acceptCall()"><i class="fa-solid fa-phone"></i></button>
      <button id="call-toggle-mic" class="call-action-btn secondary" onclick="toggleCallMic()"><i class="fa-solid fa-microphone"></i></button>
      <button id="call-toggle-cam" class="call-action-btn secondary" onclick="toggleCallCam()"><i class="fa-solid fa-camera"></i></button>
    </div>
  </div>

  <!-- Video Recorder Circle Overlay -->
  <div id="video-recorder-overlay" class="video-recorder-overlay">
    <div class="video-recorder-circle">
      <video id="recorder-preview" autoplay playsinline muted></video>
      <div class="recorder-timer" id="recorder-timer">00:00</div>
    </div>
    <div class="recorder-controls">
      <button class="call-action-btn decline" onclick="cancelRecording()"><i class="fa-solid fa-xmark"></i></button>
      <button class="call-action-btn accept" id="btn-record-action" onclick="toggleRecording()"><i class="fa-solid fa-circle"></i></button>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox-modal" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" class="lightbox-content" src="">
  </div>

  <!-- Main App Wrapper -->
  <div class="app-container">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <span>AI Index Chat</span>
          <span class="badge-premium">Private</span>
        </div>
        <div class="sidebar-actions">
          <button class="btn-secondary" onclick="copyInviteLink()"><i class="fa-solid fa-link"></i> Invite</button>
          <button class="btn-secondary" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i> Theme</button>
        </div>
      </div>

      <div class="sidebar-content">
        <div class="section-title">Members In Room</div>
        <div class="member-list" id="member-list">
          <!-- Rendered dynamically -->
        </div>

        <!-- Admin Control Box -->
        <div class="section-title">Admin Console</div>
        <div class="admin-controls-box">
          <div class="admin-title">
            <i class="fa-solid fa-crown"></i> Room Settings
          </div>
          <div class="admin-setting-item">
            <label class="admin-setting-label">Update Room Password</label>
            <input type="text" id="admin-pwd-input" class="admin-input" placeholder="New passcode">
            <button class="admin-btn" onclick="updatePassword()">Set Passcode</button>
          </div>
          <div class="admin-setting-item" style="margin-top: 15px;">
            <label class="admin-setting-label">Danger Zone</label>
            <button class="admin-btn danger" onclick="clearChatHistory()">Clear Chat History</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-window">
      <!-- Header -->
      <header class="chat-header">
        <div class="chat-header-info">
          <button class="btn-icon mobile-back-btn" onclick="toggleSidebarMobile()"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="avatar" style="background: var(--primary-gradient); font-weight: bold; width: 44px; height: 44px;">AI</div>
          <div>
            <div class="chat-header-name">AI Index Chat Room</div>
            <div class="chat-header-status" id="room-active-status">Active now — 4 Members</div>
          </div>
        </div>

        <div class="chat-header-actions">
          <button class="btn-icon call-btn" onclick="triggerFaceTimeCall(false)"><i class="fa-solid fa-phone"></i></button>
          <button class="btn-icon call-btn" onclick="triggerFaceTimeCall(true)"><i class="fa-solid fa-video"></i></button>
          <button class="btn-icon" onclick="toggleSidebarMobile()"><i class="fa-solid fa-bars"></i></button>
        </div>
      </header>

      <!-- Message History -->
      <div class="messages-container" id="messages-container">
        <!-- Messages populate here dynamically -->
      </div>

      <!-- Live Attachment Preview Bar -->
      <div id="attachment-preview" class="attachment-preview-bar">
        <span id="attachment-name">No file chosen</span>
        <button class="btn-icon" style="width: 28px; height: 28px;" onclick="clearAttachment()"><i class="fa-solid fa-times"></i></button>
      </div>

      <!-- Input Actions and Picker Panel -->
      <div class="chat-input-bar">
        <div class="input-row">
          <!-- Picker Activation Btn -->
          <button class="input-action-btn" onclick="toggleEmojiPicker()"><i class="fa-solid fa-face-smile"></i></button>
          
          <!-- Attachment Upload Selector -->
          <button class="input-action-btn" onclick="triggerMediaUpload()"><i class="fa-solid fa-plus"></i></button>
          <input type="file" id="media-upload-input" style="display: none;" onchange="handleMediaSelected(event)" accept="image/*,video/*">

          <!-- Video Circle Btn (Telegram-style "Кружочки") -->
          <button class="input-action-btn" onclick="startVideoCircleRecording()"><i class="fa-solid fa-circle-dot"></i></button>

          <!-- Main Input Field -->
          <input type="text" id="chat-input" class="chat-textbox" placeholder="iMessage" onkeydown="handleInputKeyDown(event)">
          
          <!-- Direct Send Action -->
          <button class="input-action-btn" onclick="sendMessage()"><i class="fa-solid fa-arrow-up"></i></button>
        </div>

        <!-- Popover Picker Panel (Emoji/Stickers) -->
        <div class="picker-popover" id="picker-popover">
          <div class="picker-tabs">
            <span class="picker-tab active" id="tab-emojis" onclick="switchPickerTab('emojis')">Emojis</span>
            <span class="picker-tab" id="tab-stickers" onclick="switchPickerTab('stickers')">Stickers</span>
          </div>
          <div class="picker-grid" id="picker-grid">
            <!-- Rendered via JS dynamically -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Config and Databases
    let currentPasscode = localStorage.getItem('chat_room_passcode') || '1234';
    let database = JSON.parse(localStorage.getItem('chat_messages')) || [];
    let isDarkTheme = localStorage.getItem('chat_theme') === 'dark';
    
    // Audio Synthesizer for system sounds (No external files needed)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSystemSound(type) {
      try {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'sent') {
          // Swift upward chime
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1440, audioCtx.currentTime + 0.15);
          gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'received') {
          // Double click bubble feel
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, audioCtx.currentTime);
          osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.08);
          gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'ringing') {
          // Outgoing call chime
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
          osc.frequency.setValueAtTime(480, audioCtx.currentTime + 0.05);
          gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
          osc.start();
          osc.stop(audioCtx.currentTime + 1.2);
        }
      } catch (e) {
        console.warn("Audio Context error:", e);
      }
    }

    // Mock Members list and online/offline statuses
    const members = [
      { id: 'me', name: 'You', color: '#007aff', status: 'online', admin: false },
      { id: 'alex', name: 'Alex', color: '#ff9500', status: 'online', admin: true },
      { id: 'sophie', name: 'Sophie', color: '#ff2d55', status: 'online', admin: false },
      { id: 'liam', name: 'Liam', color: '#5856d6', status: 'offline', admin: false }
    ];

    const popularEmojis = [
      '😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😙','😚',
      '😋','😛','😝','😜','🤪','🤨','🧐','🤓','😎','🥸','🤩','🥳','😏','😒','😞','😔','😟','😕','🙁','☹️',
      '🥺','😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥','😓','🤗','🤔','🫣','🤭'
    ];

    const cuteStickers = [
      '🐱', '🐶', '🦄', '🦁', '🦊', '🐼', '🐨', '🦖', '🐉', '🐙', '👾', '🚀', '🔮', '✨', '🍕', '🍩'
    ];

    let currentSelectedMember = 'me';
    let currentPickerTab = 'emojis';
    let pendingMediaBase64 = null;
    let pendingMediaType = null;

    // Password Access Modal Controls
    window.addEventListener('load', () => {
      // Apply theme
      if (isDarkTheme) {
        document.body.classList.add('dark-theme');
      }
      
      // If passcode is already entered, bypass modal
      if (sessionStorage.getItem('access_granted') === 'true') {
        document.getElementById('pwd-overlay').style.display = 'none';
      }

      renderMembers();
      renderChatMessages();
    });

    function checkPasscode() {
      const val = document.getElementById('pwd-input').value;
      if (val === currentPasscode) {
        sessionStorage.setItem('access_granted', 'true');
        // Fade out
        const overlay = document.getElementById('pwd-overlay');
        overlay.style.opacity = '0';
        setTimeout(() => overlay.style.display = 'none', 400);
        showToast('Access Granted!', 'success');
      } else {
        const card = document.getElementById('pwd-card');
        card.classList.add('shake');
        setTimeout(() => card.classList.remove('shake'), 500);
        document.getElementById('pwd-input').value = '';
        showToast('Invalid Code', 'error');
      }
    }

    // Theme Toggle
    function toggleTheme() {
      document.body.classList.toggle('dark-theme');
      const darkActive = document.body.classList.contains('dark-theme');
      localStorage.setItem('chat_theme', darkActive ? 'dark' : 'light');
    }

    // Copy Room Link to Invite Friends
    function copyInviteLink() {
      const shareUrl = window.location.href;
      navigator.clipboard.writeText(shareUrl).then(() => {
        showToast('Invite link copied!', 'success');
      }).catch(err => {
        showToast('Failed to copy link', 'error');
      });
    }

    // Dynamic members display list
    function renderMembers() {
      const container = document.getElementById('member-list');
      container.innerHTML = '';
      members.forEach(m => {
        const item = document.createElement('div');
        item.className = `member-item ${m.id === currentSelectedMember ? 'active' : ''}`;
        item.onclick = () => selectMember(m.id);

        item.innerHTML = `
          <div class="avatar-wrapper">
            <div class="avatar" style="background-color: ${m.color};">
              ${m.name[0]}
            </div>
            <div class="status-dot ${m.status === 'offline' ? 'offline' : ''}"></div>
          </div>
          <div class="member-info">
            <div class="member-name-row">
              <span class="member-name">${m.name}</span>
              ${m.admin ? '<span class="badge-admin"><i class="fa-solid fa-crown"></i> Admin</span>' : ''}
            </div>
            <div class="member-preview">${m.status === 'online' ? 'Active now' : 'Offline'}</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function selectMember(id) {
      currentSelectedMember = id;
      renderMembers();
    }

    // Render iMessage list history
    function renderChatMessages() {
      const container = document.getElementById('messages-container');
      container.innerHTML = '';

      if (database.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; color: var(--text-secondary-light); margin-top: 50px; font-size: 13px;">
            <i class="fa-solid fa-comment-dots" style="font-size: 32px; display: block; margin-bottom: 12px; color: var(--primary-color);"></i>
            No messages yet. Send a message to start!
          </div>
        `;
        return;
      }

      database.forEach(msg => {
        const row = document.createElement('div');
        row.className = `message-row ${msg.senderId === 'me' ? 'outgoing' : 'incoming'}`;

        const sender = members.find(m => m.id === msg.senderId) || { name: 'Stranger', color: '#999' };
        
        // Inner message element setup
        let bubbleContent = '';
        let bubbleClass = 'message-bubble';

        if (msg.type === 'text') {
          bubbleContent = linkify(escapeHtml(msg.content));
        } else if (msg.type === 'sticker') {
          bubbleClass += ' sticker';
          bubbleContent = msg.content;
        } else if (msg.type === 'large-emoji') {
          bubbleClass += ' large-emoji';
          bubbleContent = msg.content;
        } else if (msg.type === 'image') {
          bubbleContent = `<img src="${msg.content}" class="message-image" onclick="zoomImage('${msg.content}')" alt="Uploaded File">`;
        } else if (msg.type === 'video') {
          bubbleContent = `
            <video class="message-image" controls>
              <source src="${msg.content}">
              Your browser doesn't support the video element.
            </video>
          `;
        } else if (msg.type === 'video-circle') {
          bubbleContent = `
            <div class="video-circle-message">
              <video id="video-${msg.id}" loop playsinline>
                <source src="${msg.content}">
              </video>
              <div class="play-overlay" onclick="togglePlayVideoCircle('video-${msg.id}')">
                <i class="fa-solid fa-play"></i>
              </div>
            </div>
          `;
        }

        row.innerHTML = `
          <div class="avatar-wrapper" style="${msg.senderId === 'me' ? 'display: none;' : ''}">
            <div class="avatar" style="background-color: ${sender.color}; width: 34px; height: 34px; font-size: 13px;">
              ${sender.name[0]}
            </div>
          </div>
          <div>
            ${msg.senderId !== 'me' ? `<div class="message-sender">${sender.name}</div>` : ''}
            <div style="display: flex; gap: 8px; flex-direction: ${msg.senderId === 'me' ? 'row-reverse' : 'row'};">
              <div class="${bubbleClass}">
                ${bubbleContent}
              </div>
              <span class="message-time">${formatTime(msg.timestamp)}</span>
            </div>
          </div>
        `;

        container.appendChild(row);
      });

      // Auto scroll to bottom
      container.scrollTop = container.scrollHeight;
    }

    // Video Play/Pause Helper for circular video iMessage layout
    function togglePlayVideoCircle(elemId) {
      const v = document.getElementById(elemId);
      if (!v) return;
      const playBtn = v.nextElementSibling.querySelector('i');
      if (v.paused) {
        v.play();
        playBtn.className = "fa-solid fa-pause";
      } else {
        v.pause();
        playBtn.className = "fa-solid fa-play";
      }
    }

    // File selection handle
    function triggerMediaUpload() {
      document.getElementById('media-upload-input').click();
    }

    function handleMediaSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        pendingMediaBase64 = e.target.result;
        pendingMediaType = file.type.startsWith('video/') ? 'video' : 'image';
        
        // Show attachment review bar
        const bar = document.getElementById('attachment-preview');
        bar.style.display = 'flex';
        document.getElementById('attachment-name').innerText = `Selected ${file.name} (${Math.round(file.size / 1024)} KB)`;
      }
      reader.readAsDataURL(file);
    }

    function clearAttachment() {
      pendingMediaBase64 = null;
      pendingMediaType = null;
      document.getElementById('media-upload-input').value = '';
      document.getElementById('attachment-preview').style.display = 'none';
    }

    // Sending dynamic payloads
    function sendMessage() {
      const textInput = document.getElementById('chat-input');
      const text = textInput.value.trim();

      if (!text && !pendingMediaBase64) return;

      let msg = {
        id: 'msg-' + Date.now(),
        senderId: currentSelectedMember,
        timestamp: Date.now()
      };

      if (pendingMediaBase64) {
        msg.type = pendingMediaType;
        msg.content = pendingMediaBase64;
        clearAttachment();
      } else {
        // Detect single emojis to make them huge
        if (isOnlyEmoji(text)) {
          msg.type = 'large-emoji';
          msg.content = text;
        } else {
          msg.type = 'text';
          msg.content = text;
        }
      }

      database.push(msg);
      saveDatabase();
      textInput.value = '';
      playSystemSound('sent');
      renderChatMessages();

      // Trigger realistic simulator response after 1.5 seconds if sent by "You"
      if (msg.senderId === 'me') {
        setTimeout(simulateFriendResponse, 1500);
      }
    }

    // Robot & Interactive Friend Replies to simulate realistic activity
    function simulateFriendResponse() {
      const randomFriends = ['alex', 'sophie', 'liam'];
      const chosenFriend = randomFriends[Math.floor(Math.random() * randomFriends.length)];
      
      const responses = [
        "OMG that's fantastic! 🚀 Let's meet up soon.",
        "That looks amazing! Is this the correct room password?",
        "Wait, check this out! 😂 I love this group chat layout.",
        "Wait... Did anyone try the circular video recording? It looks just like Telegram circles!",
        "Yes! Totally agree! 💯",
        "Let me try sending you guys a selfie!",
        "Let's test FaceTime calls on this platform. Does it work?",
        "Awesome aesthetic! Super clean and feels like my iPhone."
      ];

      const chosenText = responses[Math.floor(Math.random() * responses.length)];
      
      const msg = {
        id: 'msg-' + Date.now(),
        senderId: chosenFriend,
        type: 'text',
        content: chosenText,
        timestamp: Date.now()
      };

      database.push(msg);
      saveDatabase();
      playSystemSound('received');
      renderChatMessages();
    }

    // Helper functions
    function saveDatabase() {
      localStorage.setItem('chat_messages', JSON.stringify(database));
    }

    function isOnlyEmoji(str) {
      const regex = /^\p{Emoji}$/u;
      return regex.test(str);
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function linkify(text) {
      const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
      return text.replace(urlPattern, '<a href="$1" target="_blank" style="color: inherit; text-decoration: underline;">$1</a>');
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp);
      let h = date.getHours();
      let m = date.getMinutes();
      h = h < 10 ? '0' + h : h;
      m = m < 10 ? '0' + m : m;
      return `${h}:${m}`;
    }

    function handleInputKeyDown(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    }

    // Popover Emoji Selector Options
    function toggleEmojiPicker() {
      const popover = document.getElementById('picker-popover');
      if (popover.style.display === 'block') {
        popover.style.display = 'none';
      } else {
        popover.style.display = 'block';
        renderPickerContent();
      }
    }

    function switchPickerTab(tab) {
      currentPickerTab = tab;
      document.getElementById('tab-emojis').className = tab === 'emojis' ? 'picker-tab active' : 'picker-tab';
      document.getElementById('tab-stickers').className = tab === 'stickers' ? 'picker-tab active' : 'picker-tab';
      renderPickerContent();
    }

    function renderPickerContent() {
      const grid = document.getElementById('picker-grid');
      grid.innerHTML = '';
      
      const list = currentPickerTab === 'emojis' ? popularEmojis : cuteStickers;
      list.forEach(item => {
        const span = document.createElement('span');
        span.className = 'picker-item';
        span.innerText = item;
        span.onclick = () => selectPickerItem(item, currentPickerTab);
        grid.appendChild(span);
      });
    }

    function selectPickerItem(val, type) {
      if (type === 'emojis') {
        const input = document.getElementById('chat-input');
        input.value += val;
        input.focus();
      } else {
        // Send Sticker Directly
        const msg = {
          id: 'msg-' + Date.now(),
          senderId: currentSelectedMember,
          type: 'sticker',
          content: val,
          timestamp: Date.now()
        };
        database.push(msg);
        saveDatabase();
        playSystemSound('sent');
        renderChatMessages();
        
        if (currentSelectedMember === 'me') {
          setTimeout(simulateFriendResponse, 1500);
        }
      }
      document.getElementById('picker-popover').style.display = 'none';
    }

    // Video Circle (Telegram circular videos with Webcam)
    let mediaRecorder = null;
    let recordedChunks = [];
    let streamRef = null;
    let recordTimerInterval = null;

    function startVideoCircleRecording() {
      const overlay = document.getElementById('video-recorder-overlay');
      overlay.style.display = 'flex';
      recordedChunks = [];

      navigator.mediaDevices.getUserMedia({ video: { width: 300, height: 300, facingMode: 'user' }, audio: true })
        .then(stream => {
          streamRef = stream;
          const videoElement = document.getElementById('recorder-preview');
          videoElement.srcObject = stream;
          videoElement.play();
          
          // Initialize recording button state
          const btn = document.getElementById('btn-record-action');
          btn.innerHTML = '<i class="fa-solid fa-circle"></i>';
          btn.className = 'call-action-btn accept';
        })
        .catch(err => {
          console.warn("Webcam blocked or not available, fallback to simulation mode", err);
          showToast("Webcam unavailable. Playing dynamic AI simulation!", "info");
          simulateCircularVideoFallback();
        });
    }

    function toggleRecording() {
      const btn = document.getElementById('btn-record-action');
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        // Stop
        mediaRecorder.stop();
        btn.innerHTML = '<i class="fa-solid fa-circle"></i>';
        btn.className = 'call-action-btn accept';
        clearInterval(recordTimerInterval);
      } else {
        // Start Recording
        if (!streamRef) return;
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(streamRef);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const reader = new FileReader();
          reader.onload = (e) => {
            const circleVideoUrl = e.target.result;
            // Send into chat
            const msg = {
              id: 'msg-' + Date.now(),
              senderId: currentSelectedMember,
              type: 'video-circle',
              content: circleVideoUrl,
              timestamp: Date.now()
            };
            database.push(msg);
            saveDatabase();
            playSystemSound('sent');
            renderChatMessages();
            closeVideoRecorder();
          };
          reader.readAsDataURL(blob);
        };

        mediaRecorder.start();
        btn.innerHTML = '<i class="fa-solid fa-square"></i>';
        btn.className = 'call-action-btn decline';
        
        let seconds = 0;
        document.getElementById('recorder-timer').innerText = "00:00";
        recordTimerInterval = setInterval(() => {
          seconds++;
          let m = Math.floor(seconds / 60);
          let s = seconds % 60;
          document.getElementById('recorder-timer').innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
        }, 1000);
      }
    }

    function cancelRecording() {
      closeVideoRecorder();
    }

    function closeVideoRecorder() {
      clearInterval(recordTimerInterval);
      if (streamRef) {
        streamRef.getTracks().forEach(track => track.stop());
      }
      document.getElementById('video-recorder-overlay').style.display = 'none';
    }

    // Dynamic fall-back animation simulation for video circles if camera blocked/unavailable
    function simulateCircularVideoFallback() {
      closeVideoRecorder();
      // Directly output a customized pre-recorded aesthetic simulation
      const sampleCircleUrl = "https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-background-1611-large.mp4";
      const msg = {
        id: 'msg-' + Date.now(),
        senderId: currentSelectedMember,
        type: 'video-circle',
        content: sampleCircleUrl,
        timestamp: Date.now()
      };
      database.push(msg);
      saveDatabase();
      playSystemSound('sent');
      renderChatMessages();
    }

    // Image Fullscreen zoom lightbox
    function zoomImage(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    // FaceTime Call Simulator system
    let facetimeRingInterval = null;
    let localStreamRef = null;

    function triggerFaceTimeCall(isVideo) {
      const isIncoming = Math.random() > 0.6; // Randomize incoming vs outgoing for demo fun!
      const overlay = document.getElementById('facetime-overlay');
      overlay.style.display = 'flex';
      
      const targetFriend = members.find(m => m.id === 'alex');
      document.getElementById('facetime-avatar').innerText = targetFriend.name[0];
      document.getElementById('facetime-name').innerText = targetFriend.name;
      
      const acceptBtn = document.getElementById('call-accept');
      const declineBtn = document.getElementById('call-decline');

      // Request stream if webcam available
      navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true })
        .then(stream => {
          localStreamRef = stream;
          document.getElementById('facetime-local-video').srcObject = stream;
        }).catch(err => console.warn("Camera not ready for call. Simulating avatar call style.", err));

      if (isIncoming) {
        document.getElementById('facetime-status').innerText = isVideo ? "Incoming FaceTime Video..." : "Incoming FaceTime Audio...";
        acceptBtn.style.display = 'flex';
        // Pulsing ringing sound synthesizer
        facetimeRingInterval = setInterval(() => playSystemSound('ringing'), 1200);
      } else {
        document.getElementById('facetime-status').innerText = "Connecting...";
        acceptBtn.style.display = 'none';
        
        facetimeRingInterval = setInterval(() => playSystemSound('ringing'), 1500);
        // Automatically accept call after 3 seconds in simulated outgoing
        setTimeout(() => {
          acceptCall();
        }, 3000);
      }
    }

    function acceptCall() {
      clearInterval(facetimeRingInterval);
      document.getElementById('facetime-status').innerText = "00:04";
      document.getElementById('call-accept').style.display = 'none';
      document.getElementById('facetime-video-container').style.display = 'block';
      
      showToast("Call Connected Successfully!", "success");
    }

    function endCall() {
      clearInterval(facetimeRingInterval);
      if (localStreamRef) {
        localStreamRef.getTracks().forEach(track => track.stop());
      }
      document.getElementById('facetime-video-container').style.display = 'none';
      document.getElementById('facetime-overlay').style.display = 'none';
      showToast("Call Ended", "info");
    }

    function toggleCallMic() {
      showToast("Microphone muted", "info");
    }

    function toggleCallCam() {
      showToast("Camera toggled", "info");
    }

    // Admin Panel Controls
    function updatePassword() {
      const input = document.getElementById('admin-pwd-input');
      const val = input.value.trim();
      if (!val) {
        showToast("Enter a valid password", "error");
        return;
      }
      currentPasscode = val;
      localStorage.setItem('chat_room_passcode', val);
      input.value = '';
      showToast("Password updated successfully!", "success");
    }

    function clearChatHistory() {
      if (confirm("Are you sure you want to clear the entire chat history?")) {
        database = [];
        saveDatabase();
        renderChatMessages();
        showToast("Chat history cleared!", "success");
      }
    }

    // Toast Alert Notification System
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const msgSpan = document.getElementById('toast-msg');
      const iconSpan = document.getElementById('toast-icon');

      msgSpan.innerText = message;
      if (type === 'success') {
        iconSpan.innerHTML = '<i class="fa-solid fa-circle-check" style="color: #34c759;"></i>';
      } else if (type === 'error') {
        iconSpan.innerHTML = '<i class="fa-solid fa-circle-exclamation" style="color: #ff3b30;"></i>';
      } else {
        iconSpan.innerHTML = '<i class="fa-solid fa-info-circle" style="color: #007aff;"></i>';
      }

      toast.className = "toast-notif show";
      setTimeout(() => {
        toast.className = "toast-notif";
      }, 3000);
    }

    // Responsive Mobile Back/Sidebar Toggles
    function toggleSidebarMobile() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('hidden');
    }
  </script>
</body>
</html>
