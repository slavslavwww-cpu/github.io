<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruru Burger - Fix Edition</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #111116;
            color: #fff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            touch-action: manipulation;
        }
        .game-title {
            color: #f1c40f;
            margin: 5px 0;
            font-size: 1.5em;
            text-align: center;
        }
        .stats-bar {
            display: flex;
            width: 100%;
            max-width: 600px;
            justify-content: space-between;
            background: #2c3e50;
            border: 2px solid #f1c40f;
            padding: 8px;
            box-sizing: border-box;
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        .canvas-container {
            width: 100%;
            max-width: 600px;
            position: relative;
        }
        canvas {
            background-color: #34495e;
            border: 2px solid #fff;
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 2 / 1;
        }
        .tip {
            margin: 5px 0;
            color: #2ecc71;
            font-size: 0.85em;
            font-weight: bold;
            text-align: center;
        }
        /* Кнопки управления для телефона */
        .mobile-controls {
            display: flex;
            width: 100%;
            max-width: 600px;
            justify-content: space-between;
            margin-top: 10px;
            gap: 10px;
        }
        .nav-btns {
            display: flex;
            gap: 10px;
            flex: 1;
        }
        .m-btn {
            background-color: #34495e;
            border: 3px solid #bdc3c7;
            color: white;
            font-size: 1.5em;
            font-weight: bold;
            padding: 15px 0;
            flex: 1;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
        }
        .m-btn:active {
            background-color: #f1c40f;
            color: black;
        }
        #m-action {
            background-color: #e67e22;
            border-color: #d35400;
            flex: 1;
        }
        #m-action:active {
            background-color: #d35400;
        }
        .pc-info {
            font-size: 0.8em;
            color: #7f8c8d;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<h1 class="game-title">🍔 Ruru Burger Mobile 🍔</h1>

<div class="stats-bar">
    <div>💵 Валюта: <span id="ui-money">100</span>$</div>
    <div>🥩 Склад: <span id="ui-meat">5</span> шт.</div>
    <div>⭐ Лвл: <span id="ui-level">1</span></div>
</div>

<div class="canvas-container">
    <canvas id="gameCanvas" width="600" height="300"></canvas>
</div>

<div class="tip" id="action-tip">Идите к машине слева за коробкой мяса!</div>

<!-- Кнопки для телефона -->
<div class="mobile-controls">
    <div class="nav-btns">
        <div class="m-btn" id="m-left">⬅️</div>
        <div class="m-btn" id="m-right">➡️</div>
    </div>
    <div class="m-btn" id="m-action">ДЕЙСТВИЕ</div>
</div>

<div class="pc-info">Для ПК: Стрелки клавиатуры — ходить, Пробел — действие.</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let game = { money: 100, fridgeMeat: 5, level: 1, meatCost: 10, upgradeCost: 60, burgerPrice: 15 };
    let ziggy = { x: 300, y: 200, speed: 5, dir: 1, carrying: 'nothing' };
    let bob = { x: 500, y: 210, state: 'idle', progress: 0 };

    let counterBurgers = 0;
    let guest = { state: 'none', timer: 0, patience: 100, moneyOnTable: 0 };

    // Управление
    let keys = {};
    let moveLeft = false;
    let moveRight = false;

    // Клавиатура ПК
    window.addEventListener('keydown', e => { 
        keys[e.code] = true; 
        if(e.code === 'Space') { e.preventDefault(); handleAction(); }
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Кнопки телефона
    const btnLeft = document.getElementById('m-left');
    const btnRight = document.getElementById('m-right');
    const btnAction = document.getElementById('m-action');

    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; });
    btnLeft.addEventListener('touchend', () => moveLeft = false);
    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; });
    btnRight.addEventListener('touchend', () => moveRight = false);
    btnAction.addEventListener('touchstart', (e) => { e.preventDefault(); handleAction(); });

    // Эмуляция для мышки на ПК (если проверять в режиме разработчика)
    btnLeft.addEventListener('mousedown', () => moveLeft = true);
    btnLeft.addEventListener('mouseup', () => moveLeft = false);
    btnRight.addEventListener('mousedown', () => moveRight = true);
    btnRight.addEventListener('mouseup', () => moveRight = false);
    btnAction.addEventListener('mousedown', handleAction);

    function handleAction() {
        // У грузовика (x < 100)
        if (ziggy.x < 100 && ziggy.carrying === 'nothing') {
            if (game.money >= game.meatCost) {
                game.money -= game.meatCost;
                ziggy.carrying = 'meat_box';
                showTip("Взяли мясо! Несите направо к холодильнику.");
            } else { showTip("Мало денег!"); }
        }
        // У столика гостей (x от 180 до 240)
        else if (ziggy.x >= 180 && ziggy.x <= 240) {
            if (ziggy.carrying === 'burger' && guest.state === 'waiting') {
                ziggy.carrying = 'nothing';
                guest.state = 'eating';
                guest.timer = 100;
                showTip("Гость кушает бургер.");
            } else if (ziggy.carrying === 'nothing' && guest.state === 'leaving_money') {
                game.money += guest.moneyOnTable;
                guest.moneyOnTable = 0;
                guest.state = 'none';
                showTip("Забрали выручку!");
            }
        }
        // У прилавка/кассы (x от 330 до 400)
        else if (ziggy.x >= 330 && ziggy.x <= 400) {
            if (ziggy.carrying === 'nothing' && counterBurgers > 0) {
                counterBurgers--;
                ziggy.carrying = 'burger';
                showTip("Взяли бургер! Отнесите за столик слева.");
            } else if (ziggy.carrying === 'nothing' && counterBurgers === 0) {
                if (game.money >= game.upgradeCost) {
                    game.money -= game.upgradeCost;
                    game.level++;
                    game.burgerPrice += 5;
                    game.upgradeCost = Math.floor(game.upgradeCost * 1.6);
                    showTip("Кафе улучшено! Стены обновились.");
                } else { showTip(`Для улучшения нужно ${game.upgradeCost}$.`); }
            }
        }
        // У холодильника (x > 440)
        else if (ziggy.x > 440 && ziggy.carrying === 'meat_box') {
            ziggy.carrying = 'nothing';
            game.fridgeMeat++;
            showTip("Положили мясо. Боб начинает готовить!");
        }
        updateUI();
    }

    function showTip(text) { document.getElementById('action-tip').innerText = text; }
    function updateUI() {
        document.getElementById('ui-money').innerText = game.money;
        document.getElementById('ui-meat').innerText = game.fridgeMeat;
        document.getElementById('ui-level').innerText = game.level;
    }

    function gameLoop() {
        // Передвижение
        if (keys['ArrowLeft'] || keys['KeyA'] || moveLeft) {
            ziggy.x -= ziggy.speed;
            ziggy.dir = -1;
        }
        if (keys['ArrowRight'] || keys['KeyD'] || moveRight) {
            ziggy.x += ziggy.speed;
            ziggy.dir = 1;
        }

        if (ziggy.x < 20) ziggy.x = 20;
        if (ziggy.x > 580) ziggy.x = 580;

        // Повар Боб автоматический
        if (bob.state === 'idle' && game.fridgeMeat > 0 && counterBurgers < 3) {
            game.fridgeMeat--;
            bob.state = 'cooking';
            bob.progress = 0;
            updateUI();
        }
        if (bob.state === 'cooking') {
            bob.progress += 0.6;
            if (bob.progress >= 100) {
                bob.state = 'idle';
                counterBurgers++;
            }
        }

        // Посетители
        if (guest.state === 'none' && Math.random() < 0.005) {
            guest.state = 'waiting';
            guest.patience = 100;
        }
        if (guest.state === 'waiting') {
            guest.patience -= 0.1;
            if (guest.patience <= 0) {
                guest.state = 'none';
                showTip("Гость ушел, не дождавшись еды!");
            }
        }
        if (guest.state === 'eating') {
            guest.timer--;
            if (guest.timer <= 0) {
                guest.state = 'leaving_money';
                guest.moneyOnTable = game.burgerPrice;
            }
        }

        // РИСОВАНИЕ ИГРЫ
        ctx.fillStyle = '#111'; // Улица снаружи
        ctx.fillRect(0, 0, 600, 300);

        // Внутренние стены меняются от уровня
        ctx.fillStyle = game.level >= 3 ? '#1e3f20' : (game.level === 2 ? '#2e4053' : '#34495e');
        ctx.fillRect(150, 20, 450, 230);

        // Полы
        ctx.fillStyle = '#7f8c8d'; ctx.fillRect(0, 250, 150, 50);
        ctx.fillStyle = '#2c3e50'; ctx.fillRect(150, 250, 450, 50);

        // Дверь
        ctx.fillStyle = '#7e5109'; ctx.fillRect(150, 150, 35, 100);

        // Машина снабжения
        ctx.fillStyle = '#c0392b'; ctx.fillRect(10, 160, 80, 60);
        ctx.fillStyle = '#f1c40f'; ctx.fillRect(90, 180, 15, 40);
