<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СТРОЙ ДОМ | Маркетплейс строительных материалов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --primary: #ff6b00;
            --primary-hover: #e66000;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border: #262626;
            --success: #22c55e;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(255, 107, 0, 0.15) 0%, transparent 50%),
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 100% 100%, 50px 50px, 50px 50px;
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade {
            animation: fadeIn 0.5s ease forwards;
        }

        header {
            background-color: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.8rem 5%;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }

        .logo-container {
            grid-column: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .slogan {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: -2px;
            font-weight: 400;
        }

        .nav-actions {
            grid-column: 3;
            justify-self: end;
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            position: relative;
            transition: var(--transition);
        }

        .nav-btn:hover {
            color: var(--primary);
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: var(--primary);
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 50%;
            font-weight: bold;
        }

        main {
            padding: 2rem 5%;
            max-width: 1400px;
            margin: 0 auto;
            min-height: 80vh;
        }

        .hero {
            padding: 4rem 0;
            text-align: center;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .hero h1 span {
            color: var(--primary);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .categories {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cat-btn {
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(255, 107, 0, 0.1);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #1a1a1a;
        }

        /* Completed CSS */
        .product-info {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .product-category {
            font-size: 0.8rem;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 600;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            margin-top: auto;
        }

        .product-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn-buy {
            flex-grow: 1;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-buy:hover {
            background: var(--primary-hover);
        }

        footer {
            border-top: 1px solid var(--border);
            padding: 4rem 5%;
            margin-top: 4rem;
            text-align: center;
            color: var(--text-muted);
        }

        /* Admin UI Styles */
        #admin-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 1rem;
            margin-bottom: 2rem;
            border-radius: 12px;
            display: none;
        }

        .admin-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .admin-input {
            background: #1a1a1a;
            border: 1px solid var(--border);
            padding: 0.8rem;
            border-radius: 8px;
            color: white;
        }

        .admin-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.4rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="#" class="logo">
                <i data-lucide="hard-hat"></i>
                СТРОЙ ДОМ
            </a>
            <div class="slogan">качество в каждом кирпиче</div>
        </div>
        <div class="nav-actions">
            <button class="nav-btn" id="admin-toggle">
                <i data-lucide="settings"></i>
            </button>
            <button class="nav-btn">
                <i data-lucide="shopping-cart"></i>
                <span class="cart-count">0</span>
            </button>
        </div>
    </header>

    <main>
        <section class="hero animate-fade">
            <h1>Все для вашего <span>дома</span></h1>
            <p>Маркетплейс строительных материалов с доставкой до объекта</p>
        </section>

        <div id="admin-panel">
            <h3>Панель управления (Администратор)</h3>
            <div class="admin-form">
                <input type="text" id="p-title" class="admin-input" placeholder="Название товара">
                <input type="text" id="p-price" class="admin-input" placeholder="Цена (напр. 1500 ₽)">
                <input type="text" id="p-img" class="admin-input" placeholder="URL изображения">
                <input type="text" id="p-cat" class="admin-input" placeholder="Категория">
                <button id="add-product" class="admin-btn">Добавить товар</button>
            </div>
        </div>

        <div class="categories">
            <button class="cat-btn active">Все</button>
            <button class="cat-btn">Кирпич</button>
            <button class="cat-btn">Бетон</button>
            <button class="cat-btn">Инструменты</button>
        </div>

        <div class="products-grid" id="products-container">
            <!-- Products will be here -->
        </div>
    </main>

    <footer>
        <p>&copy; 2024 СТРОЙ ДОМ. Все права защищены.</p>
    </footer>

    <script>
        // --- КОНФИГУРАЦИЯ FIREBASE ---
        // Чтобы изменения видели ВСЕ, вам нужно:
        // 1. Зайти на https://console.firebase.google.com/
        // 2. Создать проект и добавить "Web App".
        // 3. Включить "Realtime Database" в меню Build.
        // 4. В правилах (Rules) базы данных установить: ".read": true, ".write": true (для теста).
        // 5. Скопируйте ваш config ниже:
        const firebaseConfig = {
            apiKey: "ВАШ_API_KEY",
            authDomain: "ВАШ_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://ВАШ_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "ВАШ_PROJECT_ID",
            storageBucket: "ВАШ_PROJECT_ID.appspot.com",
            messagingSenderId: "ВАШ_SENDER_ID",
            appId: "ВАШ_APP_ID"
        };

        // Инициализация (если конфиг заполнен)
        let db = null;
        if (firebaseConfig.apiKey !== "ВАШ_API_KEY") {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        }

        // Initialize Lucide icons
        lucide.createIcons();

        // App State
        let products = [];
        let isAdmin = false;

        // Elements
        const adminToggle = document.getElementById('admin-toggle');
        const adminPanel = document.getElementById('admin-panel');
        const productsContainer = document.getElementById('products-container');
        const addProductBtn = document.getElementById('add-product');

        // Admin Toggle Logic
        adminToggle.addEventListener('click', () => {
            isAdmin = !isAdmin;
            adminPanel.style.display = isAdmin ? 'block' : 'none';
            renderProducts();
        });

        // Load Products from Firebase
        if (db) {
            db.ref('products').on('value', (snapshot) => {
                const data = snapshot.val();
                products = data ? Object.keys(data).map(key => ({...data[key], fireId: key})) : [];
                renderProducts();
            });
        }

        // Add Product Event Listener
        addProductBtn.addEventListener('click', () => {
            const title = document.getElementById('p-title').value;
            const price = document.getElementById('p-price').value;
            const img = document.getElementById('p-img').value;
            const cat = document.getElementById('p-cat').value;

            if (title && price) {
                const newProduct = {
                    id: Date.now(),
                    title,
                    price,
                    image: img || 'https://images.unsplash.com/photo-1581094794329-c8112a89af12?auto=format&fit=crop&q=80&w=400',
                    category: cat || 'Общее'
                };
                
                if (db) {
                    db.ref('products').push(newProduct);
                } else {
                    // Fallback to local if no Firebase (for preview)
                    products.push(newProduct);
                    renderProducts();
                }
                clearForm();
            } else {
                alert('Пожалуйста, заполните название и цену');
            }
        });

        function clearForm() {
            document.getElementById('p-title').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-img').value = '';
            document.getElementById('p-cat').value = '';
        }

        function renderProducts() {
            productsContainer.innerHTML = '';
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card animate-fade';
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.title}" class="product-img">
                    <div class="product-info">
                        <span class="product-category">${product.category}</span>
                        <h3 class="product-title">${product.title}</h3>
                        <div class="product-price">${product.price}</div>
                        <div class="product-actions">
                            <button class="btn-buy">
                                <i data-lucide="shopping-cart"></i>
                                В корзину
                            </button>
                            ${isAdmin ? `<button class="delete-btn" onclick="deleteProduct('${product.fireId || product.id}')">Удалить</button>` : ''}
                        </div>
                    </div>
                `;
                productsContainer.appendChild(card);
            });
            lucide.createIcons();
        }

        window.deleteProduct = (id) => {
            if (db && id.length > 15) { // Firebase IDs are long strings
                db.ref('products/' + id).remove();
            } else {
                products = products.filter(p => p.id != id);
                renderProducts();
            }
        };

        // Initial render
        renderProducts();
    </script>
</body>
</html>
