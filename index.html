<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СТРОЙ ДОМ | Маркетплейс строительных материалов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --primary: #ff6b00;
            --primary-hover: #e66000;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border: #262626;
            --success: #22c55e;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(255, 107, 0, 0.15) 0%, transparent 50%),
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 100% 100%, 50px 50px, 50px 50px;
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.5s ease forwards; }

        header {
            background-color: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
            padding: 0.8rem 5%;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        }

        .logo-container { grid-column: 2; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 0.7rem; text-transform: uppercase; letter-spacing: 2px; }
        .slogan { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 4px; margin-top: -2px; font-weight: 400; }

        .nav-actions { grid-column: 3; justify-self: end; display: flex; gap: 1.5rem; align-items: center; }
        .nav-btn { background: none; border: none; color: var(--text-main); cursor: pointer; position: relative; transition: var(--transition); }
        .nav-btn:hover { color: var(--primary); }
        .cart-count { position: absolute; top: -8px; right: -8px; background-color: var(--primary); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 50%; font-weight: bold; }

        main { padding: 2rem 5%; max-width: 1400px; margin: 0 auto; min-height: 80vh; }
        .hero { padding: 4rem 0; text-align: center; }
        .hero h1 { font-size: 3.5rem; font-weight: 800; margin-bottom: 1rem; }
        .hero h1 span { color: var(--primary); }
        .hero p { color: var(--text-muted); font-size: 1.2rem; max-width: 600px; margin: 0 auto; }

        .categories { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; justify-content: center; }
        .cat-btn { padding: 0.6rem 1.5rem; border-radius: 50px; background: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); cursor: pointer; transition: var(--transition); font-weight: 500; }
        .cat-btn.active, .cat-btn:hover { background: var(--primary); border-color: var(--primary); color: white; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: var(--transition); display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 30px rgba(255, 107, 0, 0.1); }
        .product-img { width: 100%; height: 200px; object-fit: cover; background: #1a1a1a; }
        .product-info { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; }
        .product-cat { color: var(--primary); font-size: 0.8rem; text-transform: uppercase; font-weight: 700; margin-bottom: 0.5rem; }
        .product-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }
        .product-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; flex-grow: 1; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; }
        .product-price { font-size: 1.3rem; font-weight: 800; }

        .add-to-cart { background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; transition: var(--transition); font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s ease; }

        .cart-container { display: grid; grid-template-columns: 1fr 350px; gap: 2rem; }
        .cart-items { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 1.5rem; }
        .cart-item { display: grid; grid-template-columns: 80px 1fr auto auto; align-items: center; gap: 1.5rem; padding: 1rem 0; border-bottom: 1px solid var(--border); }
        .cart-item img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; }
        .cart-item-qty { display: flex; align-items: center; gap: 1rem; background: var(--bg-color); padding: 0.3rem 0.8rem; border-radius: 6px; }
        .remove-btn { color: #ff4444; background: none; border: none; cursor: pointer; }

        .checkout-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; height: fit-content; position: sticky; top: 100px; }
        .form-group { margin-bottom: 1.2rem; }
        input, select, textarea { width: 100%; padding: 0.8rem 1rem; background: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; color: white; transition: var(--transition); }
        .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 1rem; border-radius: 8px; font-weight: 700; cursor: pointer; transition: var(--transition); }

        .admin-login { max-width: 400px; margin: 100px auto; background: var(--card-bg); padding: 2rem; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .admin-panel-content { display: grid; grid-template-columns: 300px 1fr; gap: 2rem; }
        .admin-sidebar { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 1rem; height: fit-content; }
        .admin-nav-item { padding: 0.8rem 1rem; border-radius: 8px; cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.5rem; }
        .admin-nav-item.active { background: var(--primary); color: white; }
        .admin-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .admin-table th, .admin-table td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal-content { background: var(--card-bg); padding: 2rem; border-radius: 16px; border: 1px solid var(--border); max-width: 600px; width: 90%; position: relative; }
        #toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--primary); color: white; padding: 1rem 2rem; border-radius: 8px; transform: translateY(150%); transition: transform 0.4s; z-index: 2000; }
        #toast.show { transform: translateY(0); }

        @media (max-width: 768px) {
            .cart-container, .admin-panel-content { grid-template-columns: 1fr; }
            header { padding: 1rem; grid-template-columns: 1fr auto; gap: 1rem; }
            .logo-container { grid-column: 1; align-items: flex-start; text-align: left; }
            .logo { font-size: 1.4rem; } .slogan { font-size: 0.6rem; letter-spacing: 2px; }
            .nav-actions { grid-column: 2; }
        }
    </style>
</head>
<body>

    <header>
        <div></div>
        <div class="logo-container">
            <a href="#" class="logo" onclick="showSection('home')">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 10l9-8 9 8v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V10z"></path>
                    <path d="M15 2h3v5"></path>
                    <path d="M9 22V12h6v10"></path>
                </svg>
                Строй дом
            </a>
            <span class="slogan">мы строим мечты</span>
        </div>
        <div class="nav-actions">
            <button class="nav-btn" onclick="showSection('cart')">
                <i data-lucide="shopping-cart"></i>
                <span class="cart-count" id="cartCount">0</span>
            </button>
            <button class="nav-btn" onclick="showAdmin()">
                <i data-lucide="user-cog"></i>
            </button>
        </div>
    </header>

    <main id="mainContent">
        <section id="homeSection" class="section active">
            <div class="hero animate-fade">
                <h1>Стройте <span>Надежно</span></h1>
                <p>Лучшие стройматериалы в один клик. Качество и скорость.</p>
            </div>
            <div class="categories" id="categoryFilters"></div>
            <div class="products-grid" id="productsGrid"></div>
        </section>

        <section id="cartSection" class="section">
            <div class="section-header"><button class="nav-btn" onclick="showSection('home')"><i data-lucide="arrow-left"></i> Назад</button><h2>Корзина</h2></div>
            <div class="cart-container">
                <div class="cart-items" id="cartItemsList"></div>
                <div class="checkout-card">
                    <h3>Оформление</h3>
                    <div id="summaryTotal" style="font-size: 1.5rem; font-weight: 800; margin: 1rem 0;">0 ₽</div>
                    <form onsubmit="handleCheckout(event)">
                        <div class="form-group"><input type="text" id="custName" required placeholder="Имя"></div>
                        <div class="form-group"><input type="tel" id="custPhone" required placeholder="Телефон"></div>
                        <div class="form-group">
                            <select id="deliveryMethod" onchange="toggleAddressField()">
                                <option value="Самовывоз">Самовывоз</option>
                                <option value="Доставка">Доставка</option>
                            </select>
                        </div>
                        <div class="form-group" id="addressField" style="display: none;"><textarea id="custAddress" placeholder="Адрес"></textarea></div>
                        <button type="submit" class="btn-submit">ЗАКАЗАТЬ</button>
                    </form>
                </div>
            </div>
        </section>

        <section id="adminLoginSection" class="section">
            <div class="admin-login">
                <h2>Админ-вход</h2>
                <form onsubmit="handleAdminLogin(event)">
                    <div class="form-group"><input type="password" id="adminPass" placeholder="Пароль admin123" required></div>
                    <button type="submit" class="btn-submit">Войти</button>
                </form>
            </div>
        </section>

        <section id="adminPanelSection" class="section">
            <div class="section-header"><h2>Управление</h2><button class="cat-btn" onclick="logoutAdmin()">Выход</button></div>
            <div class="admin-panel-content">
                <aside class="admin-sidebar">
                    <div class="admin-nav-item active" onclick="switchAdminTab('orders', this)">Заказы</div>
                    <div class="admin-nav-item" onclick="switchAdminTab('products', this)">Товары</div>
                    <div class="admin-nav-item" onclick="switchAdminTab('settings', this)">TG Настройки</div>
                </aside>
                <div class="admin-main">
                    <div id="adminOrdersTab" class="admin-tab"><table class="admin-table"><thead><tr><th>ID</th><th>Клиент</th><th>Сумма</th><th>Действие</th></tr></thead><tbody id="adminOrdersList"></tbody></table></div>
                    <div id="adminProductsTab" class="admin-tab" style="display:none;"><button class="add-to-cart" onclick="openProductModal()" style="margin-bottom:1rem">Добавить товар</button><table class="admin-table"><thead><tr><th>Фото</th><th>Название</th><th>Цена</th><th>Действие</th></tr></thead><tbody id="adminProductsList"></tbody></table></div>
                    <div id="adminSettingsTab" class="admin-tab" style="display:none;"><div class="form-group"><label>Bot Token</label><input type="password" id="tgToken"></div><div class="form-group"><label>Chat ID</label><input type="text" id="tgChatId"></div><button class="btn-submit" onclick="saveAdminSettings()">Сохранить</button></div>
                </div>
            </div>
        </section>
    </main>

    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <i data-lucide="x" class="close-modal" onclick="closeProductModal()"></i>
            <h2>Новый товар</h2>
            <form onsubmit="handleProductSubmit(event)">
                <div class="form-group"><input type="text" id="pName" required placeholder="Название"></div>
                <div class="form-group"><input type="number" id="pPrice" required placeholder="Цена"></div>
                <div class="form-group"><select id="pCategory"><option value="Инструменты">Инструменты</option><option value="Цемент">Цемент</option></select></div>
                <div class="form-group"><textarea id="pDesc" placeholder="Описание"></textarea></div>
                <div class="form-group"><input type="url" id="pImg" placeholder="Фото URL"></div>
                <button type="submit" class="btn-submit">Сохранить</button>
            </form>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const ADMIN_PASSWORD = 'admin123';
        const STARTER_PRODUCTS = [
            { id: 1, name: 'Перфоратор BOSCH', desc: 'Профессиональный.', price: 12500, category: 'Инструменты', img: 'https://images.unsplash.com/photo-1504148455328-c376907d081c?q=80&w=800&auto=format&fit=crop' },
            { id: 2, name: 'Цемент М500', desc: 'Надежный.', price: 650, category: 'Цемент', img: 'https://images.unsplash.com/photo-1518709766631-a6a7f45921c3?q=80&w=800&auto=format&fit=crop' }
        ];

        let products = JSON.parse(localStorage.getItem('products')) || STARTER_PRODUCTS;
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let orders = JSON.parse(localStorage.getItem('orders')) || [];
        let config = JSON.parse(localStorage.getItem('stroy_config')) || { tgToken: '', tgChatId: '' };
        let currentFilter = 'Все';

        function saveData() {
            localStorage.setItem('products', JSON.stringify(products));
            localStorage.setItem('cart', JSON.stringify(cart));
            localStorage.setItem('orders', JSON.stringify(orders));
            localStorage.setItem('stroy_config', JSON.stringify(config));
            document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + i.qty, 0);
        }

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id + 'Section').classList.add('active');
            if(id === 'home') { renderFilters(); renderProducts(); }
            if(id === 'cart') renderCart();
        }

        function renderFilters() {
            const cats = ['Все', ...new Set(products.map(p => p.category))];
            document.getElementById('categoryFilters').innerHTML = cats.map(c => `<button class="cat-btn ${currentFilter===c?'active':''}" onclick="filterProducts('${c}')">${c}</button>`).join('');
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const filtered = currentFilter === 'Все' ? products : products.filter(p => p.category === currentFilter);
            grid.innerHTML = filtered.map(p => `<div class="product-card animate-fade"><img src="${p.img}" class="product-img"><div class="product-info"><span class="product-cat">${p.category}</span><h3>${p.name}</h3><p>${p.price} ₽</p><button class="add-to-cart" onclick="addToCart(${p.id})">В корзину</button></div></div>`).join('');
            lucide.createIcons();
        }

        function filterProducts(c) { currentFilter = c; renderFilters(); renderProducts(); }

        function addToCart(id) {
            const p = products.find(i => i.id === id);
            const inCart = cart.find(i => i.id === id);
            if (inCart) inCart.qty++; else cart.push({...p, qty: 1});
            saveData(); showToast('Добавлено!');
        }

        function renderCart() {
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            document.getElementById('cartItemsList').innerHTML = cart.map(i => `<div class="cart-item"><img src="${i.img}"><div><h4>${i.name}</h4><p>${i.qty} шт.</p></div><button class="remove-btn" onclick="removeFromCart(${i.id})">Удалить</button></div>`).join('');
            document.getElementById('summaryTotal').innerText = total + ' ₽';
        }

        function removeFromCart(id) { cart = cart.filter(i => i.id !== id); saveData(); renderCart(); }
        function toggleAddressField() { document.getElementById('addressField').style.display = document.getElementById('deliveryMethod').value === 'Доставка' ? 'block' : 'none'; }

        async function handleCheckout(e) {
            e.preventDefault();
            const order = { id: Date.now(), total: cart.reduce((s, i) => s + (i.price * i.qty), 0), customer: { name: document.getElementById('custName').value } };
            orders.push(order);
            if(config.tgToken) await fetch(`https://api.telegram.org/bot${config.tgToken}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: config.tgChatId, text: `Заказ на ${order.total} ₽` }) });
            cart = []; saveData(); alert('Успешно!'); showSection('home');
        }

        function handleAdminLogin(e) { e.preventDefault(); if (document.getElementById('adminPass').value === ADMIN_PASSWORD) { sessionStorage.setItem('isAdmin', 'true'); showAdmin(); } else alert('Нет'); }
        function logoutAdmin() { sessionStorage.removeItem('isAdmin'); showSection('home'); }
        function showAdmin() { if (sessionStorage.getItem('isAdmin') === 'true') showSection('adminPanel'); else showSection('adminLogin'); }

        function switchAdminTab(t, el) {
            document.querySelectorAll('.admin-tab').forEach(x => x.style.display = 'none');
            document.querySelectorAll('.admin-nav-item').forEach(x => x.classList.remove('active'));
            document.getElementById('admin' + t.charAt(0).toUpperCase() + t.slice(1) + 'Tab').style.display = 'block';
            el.classList.add('active');
            if(t === 'orders') document.getElementById('adminOrdersList').innerHTML = orders.map(o => `<tr><td>${o.id}</td><td>${o.customer.name}</td><td>${o.total} ₽</td><td><button onclick="deleteOrder(${o.id})">X</button></td></tr>`).join('');
            if(t === 'products') document.getElementById('adminProductsList').innerHTML = products.map(p => `<tr><td><img src="${p.img}" width="40"></td><td>${p.name}</td><td>${p.price} ₽</td><td><button onclick="deleteProduct(${p.id})">X</button></td></tr>`).join('');
        }

        function deleteOrder(id) { orders = orders.filter(o => o.id !== id); saveData(); switchAdminTab('orders', document.querySelector('.admin-nav-item.active')); }
        function deleteProduct(id) { products = products.filter(p => p.id !== id); saveData(); switchAdminTab('products', document.querySelector('.admin-nav-item.active')); }

        function saveAdminSettings() { config.tgToken = document.getElementById('tgToken').value; config.tgChatId = document.getElementById('tgChatId').value; saveData(); showToast('Ок'); }
        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
        function openProductModal() { document.getElementById('productModal').style.display = 'flex'; }
        function closeProductModal() { document.getElementById('productModal').style.display = 'none'; }
        function handleProductSubmit(e) {
            e.preventDefault();
            products.push({ id: Date.now(), name: document.getElementById('pName').value, price: document.getElementById('pPrice').value, category: document.getElementById('pCategory').value, img: document.getElementById('pImg').value });
            saveData(); closeProductModal(); switchAdminTab('products', document.querySelector('.admin-nav-item.active'));
        }

        saveData(); renderFilters(); renderProducts(); lucide.createIcons();
    </script>
</body>
</html>
