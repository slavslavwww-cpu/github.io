<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СТРОЙ ДОМ | Маркетплейс строительных материалов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --primary: #ff6b00;
            --primary-hover: #e66000;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border: #262626;
            --success: #22c55e;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(255, 107, 0, 0.05), transparent 400px);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade {
            animation: fadeIn 0.5s ease forwards;
        }

        header {
            background-color: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-actions {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            position: relative;
            transition: var(--transition);
        }

        .nav-btn:hover { color: var(--primary); }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: var(--primary);
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 50%;
            font-weight: bold;
        }

        main {
            padding: 2rem 5%;
            max-width: 1400px;
            margin: 0 auto;
            min-height: 80vh;
        }

        .hero {
            padding: 4rem 0;
            text-align: center;
        }

        .hero h1 { font-size: 3.5rem; font-weight: 800; margin-bottom: 1rem; }
        .hero h1 span { color: var(--primary); }
        .hero p { color: var(--text-muted); font-size: 1.2rem; max-width: 600px; margin: 0 auto; }

        .categories {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cat-btn {
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(255, 107, 0, 0.1);
        }

        .product-img { width: 100%; height: 200px; object-fit: cover; background: #1a1a1a; }

        .product-info { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; }

        .product-cat { color: var(--primary); font-size: 0.8rem; text-transform: uppercase; font-weight: 700; margin-bottom: 0.5rem; }

        .product-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }

        .product-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            min-height: 4.2em;
        }

        .btn-more {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            margin-bottom: 1rem;
            text-align: left;
        }

        .product-footer { display: flex; justify-content: space-between; align-items: center; }

        .product-price { font-size: 1.3rem; font-weight: 800; }

        .add-to-cart {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .add-to-cart:hover { background: var(--primary-hover); }

        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s ease; }

        .section-header { margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; }

        .btn-back { display: flex; align-items: center; gap: 0.5rem; color: var(--text-muted); cursor: pointer; text-decoration: none; }

        .cart-container { display: grid; grid-template-columns: 1fr 350px; gap: 2rem; }

        .cart-items { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 1.5rem; }

        .cart-item {
            display: grid;
            grid-template-columns: 80px 1fr auto auto;
            align-items: center;
            gap: 1.5rem;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
        }

        .cart-item img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; }

        .cart-item-qty { display: flex; align-items: center; gap: 1rem; background: var(--bg-color); padding: 0.3rem 0.8rem; border-radius: 6px; }

        .qty-btn { background: none; border: none; color: var(--text-main); cursor: pointer; font-weight: bold; }

        .remove-btn { color: #ff4444; background: none; border: none; cursor: pointer; }

        .checkout-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; height: fit-content; position: sticky; top: 100px; }

        .summary-total { border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1rem; font-size: 1.4rem; font-weight: 800; }

        .form-group { margin-bottom: 1.2rem; }

        label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; }

        input, select, textarea { width: 100%; padding: 0.8rem 1rem; background: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; color: white; font-size: 1rem; }

        input:focus { outline: none; border-color: var(--primary); }

        .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 1rem; border-radius: 8px; font-weight: 700; cursor: pointer; transition: var(--transition); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            max-width: 600px;
            width: 95%;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal { position: absolute; top: 1rem; right: 1rem; cursor: pointer; color: var(--text-muted); }

        .admin-login { max-width: 400px; margin: 100px auto; background: var(--card-bg); padding: 2rem; border-radius: 12px; border: 1px solid var(--border); text-align: center; }

        .admin-panel-content { display: grid; grid-template-columns: 300px 1fr; gap: 2rem; }

        .admin-sidebar { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 1rem; height: fit-content; }

        .admin-nav-item { padding: 0.8rem 1rem; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.5rem; }

        .admin-nav-item.active { background: var(--primary); color: white; }

        .admin-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }

        .admin-table th, .admin-table td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }

        .order-badge { padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .badge-pending { background: #3b82f6; }
        .badge-success { background: #10b981; }

        #toast {
            position: fixed;
            bottom: 2rem; right: 2rem;
            background: var(--primary);
            color: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            transform: translateY(150%);
            transition: transform 0.4s;
            z-index: 2000;
        }

        #toast.show { transform: translateY(0); }

        @media (max-width: 768px) {
            .cart-container, .admin-panel-content { grid-template-columns: 1fr; }
            .hero h1 { font-size: 2.2rem; }
            header { padding: 1rem; }
            .admin-sidebar { display: flex; overflow-x: auto; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="showSection('home')">
            <i data-lucide="hard-hat"></i> СТРОЙ ДОМ
        </a>
        <div class="nav-actions">
            <button class="nav-btn" onclick="showSection('cart')">
                <i data-lucide="shopping-cart"></i>
                <span class="cart-count" id="cartCount">0</span>
            </button>
            <button class="nav-btn" onclick="showAdmin()">
                <i data-lucide="user-cog"></i>
            </button>
        </div>
    </header>

    <main id="mainContent">
        <section id="homeSection" class="section active">
            <div class="hero animate-fade">
                <h1>Стройте <span>Надежно</span></h1>
                <p>Маркетплейс строительных материалов премиум-класса.</p>
            </div>
            <div class="categories" id="categoryFilters"></div>
            <div class="products-grid" id="productsGrid"></div>
        </section>

        <section id="cartSection" class="section">
            <div class="section-header">
                <a class="btn-back" onclick="showSection('home')"><i data-lucide="arrow-left"></i> К покупкам</a>
                <h2>Корзина</h2>
            </div>
            <div class="cart-container">
                <div class="cart-items" id="cartItemsList"></div>
                <div class="checkout-card">
                    <h3>Оформление</h3>
                    <div class="summary-total">
                        <div style="display:flex; justify-content: space-between;">
                            <span>Итого:</span><span id="summaryTotal">0 ₽</span>
                        </div>
                    </div>
                    <form id="checkoutForm" onsubmit="handleCheckout(event)" style="margin-top: 1.5rem;">
                        <div class="form-group"><label>Имя</label><input type="text" id="custName" required></div>
                        <div class="form-group"><label>Телефон</label><input type="tel" id="custPhone" required></div>
                        <div class="form-group">
                            <label>Получение</label>
                            <select id="deliveryMethod" onchange="toggleAddressField()">
                                <option value="Самовывоз">Самовывоз</option>
                                <option value="Доставка">Доставка</option>
                            </select>
                        </div>
                        <div class="form-group" id="addressField" style="display: none;">
                            <label>Адрес</label><textarea id="custAddress" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn-submit">ОФОРМИТЬ</button>
                    </form>
                </div>
            </div>
        </section>

        <section id="adminLoginSection" class="section">
            <div class="admin-login">
                <i data-lucide="lock" size="48" style="color: var(--primary); margin-bottom: 1rem;"></i>
                <h2>Вход</h2>
                <form onsubmit="handleAdminLogin(event)">
                    <div class="form-group"><input type="password" id="adminPass" placeholder="Пароль" required></div>
                    <button type="submit" class="btn-submit">ВОЙТИ</button>
                </form>
            </div>
        </section>

        <section id="adminPanelSection" class="section">
            <div class="section-header"><h2>Админ-панель</h2><button class="cat-btn" onclick="logoutAdmin()">Выйти</button></div>
            <div class="admin-panel-content">
                <aside class="admin-sidebar">
                    <div class="admin-nav-item active" onclick="switchAdminTab('orders', this)"><i data-lucide="package"></i> Заказы</div>
                    <div class="admin-nav-item" onclick="switchAdminTab('products', this)"><i data-lucide="package-search"></i> Товары</div>
                    <div class="admin-nav-item" onclick="switchAdminTab('settings', this)"><i data-lucide="settings"></i> Настройки TG</div>
                </aside>
                <div class="admin-main">
                    <div id="adminOrdersTab" class="admin-tab"><table class="admin-table"><thead><tr><th>ID</th><th>Клиент</th><th>Сумма</th><th>Доставка</th><th>Статус</th><th></th></tr></thead><tbody id="adminOrdersList"></tbody></table></div>
                    <div id="adminProductsTab" class="admin-tab" style="display:none;">
                        <div style="display:flex; justify-content: space-between; margin-bottom: 1rem;"><h3>Товары</h3><button class="add-to-cart" onclick="openProductModal()"><i data-lucide="plus"></i> Добавить</button></div>
                        <table class="admin-table"><thead><tr><th>Фото</th><th>Название</th><th>Цена</th><th>Действие</th></tr></thead><tbody id="adminProductsList"></tbody></table>
                    </div>
                    <div id="adminSettingsTab" class="admin-tab" style="display:none;">
                        <div style="max-width: 500px; background: var(--card-bg); padding: 2rem; border-radius: 12px;">
                            <h3>Telegram Настройки</h3>
                            <div class="form-group" style="margin-top:1rem;"><label>Bot Token</label><input type="password" id="tgToken"></div>
                            <div class="form-group"><label>Chat ID</label><input type="text" id="tgChatId"></div>
                            <button class="btn-submit" onclick="saveAdminSettings()">СОХРАНИТЬ</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div class="modal-overlay" id="detailsModal"><div class="modal-content"><i data-lucide="x" class="close-modal" onclick="closeDetailsModal()"></i><div id="detailsContent"></div></div></div>

    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <i data-lucide="x" class="close-modal" onclick="closeProductModal()"></i><h2 id="modalTitle">Товар</h2>
            <form id="productForm" onsubmit="handleProductSubmit(event)" style="margin-top: 1.5rem;">
                <input type="hidden" id="editProductId">
                <div class="form-group"><label>Название</label><input type="text" id="pName" required></div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group"><label>Цена (₽)</label><input type="number" id="pPrice" required></div>
                    <div class="form-group"><label>Категория</label><select id="pCategory"></select></div>
                </div>
                <div class="form-group"><label>Описание</label><textarea id="pDesc" rows="3"></textarea></div>
                <div class="form-group">
                    <label>Фото (URL или файл)</label>
                    <input type="url" id="pImg" placeholder="https://...">
                    <input type="file" accept="image/*" onchange="handleImageUpload(this)" style="margin-top:0.5rem;">
                </div>
                <button type="submit" class="btn-submit">СОХРАНИТЬ</button>
            </form>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const ADMIN_PASSWORD = 'admin123';
        const STARTER_PRODUCTS = [
            { id: 1, name: 'Перфоратор BOSCH Professional', desc: 'Мощный инструмент для профессионалов. Идеально подходит для сверления с ударом в бетоне, кирпиче и камне. Оснащен системой защиты пользователя.', price: 12500, category: 'Инструменты', img: 'https://images.unsplash.com/photo-1504148455328-c376907d081c?q=80&w=800' },
            { id: 2, name: 'Цемент М500 (50кг)', desc: 'Высококачественный портландцемент для строительных работ любой сложности. Обеспечивает высокую прочность конструкций.', price: 650, category: 'Цемент', img: 'https://images.unsplash.com/photo-1518709766631-a6a7f45921c3?q=80&w=800' },
            { id: 3, name: 'Кирпич облицовочный', desc: 'Керамический кирпич с идеальной геометрией. Предназначен для внешней отделки зданий. Устойчив к морозам.', price: 35, category: 'Кирпич', img: 'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=800' },
            { id: 4, name: 'Набор саморезов (1000 шт)', desc: 'Саморезы по дереву из закаленной стали. Острое жало и качественная резьба обеспечивают легкое вкручивание.', price: 850, category: 'Крепеж', img: 'https://images.unsplash.com/photo-1586864387417-f58fd4c50e4e?q=80&w=800' }
        ];

        let products = JSON.parse(localStorage.getItem('products')) || STARTER_PRODUCTS;
        let categories = JSON.parse(localStorage.getItem('categories')) || ['Инструменты', 'Цемент', 'Кирпич', 'Крепеж'];
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let orders = JSON.parse(localStorage.getItem('orders')) || [];
        let config = JSON.parse(localStorage.getItem('stroy_config')) || { tgToken: '', tgChatId: '' };
        let currentFilter = 'Все';

        function saveData() {
            localStorage.setItem('products', JSON.stringify(products));
            localStorage.setItem('categories', JSON.stringify(categories));
            localStorage.setItem('cart', JSON.stringify(cart));
            localStorage.setItem('orders', JSON.stringify(orders));
            localStorage.setItem('stroy_config', JSON.stringify(config));
            updateCartCount();
        }

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id + 'Section').classList.add('active');
            if(id === 'home') { renderFilters(); renderProducts(); }
            if(id === 'cart') renderCart();
            window.scrollTo(0,0);
        }

        function showAdmin() {
            if (sessionStorage.getItem('isAdmin') === 'true') showSection('adminPanel'); else showSection('adminLogin');
        }

        function renderFilters() {
            const f = document.getElementById('categoryFilters');
            f.innerHTML = `<button class="cat-btn ${currentFilter === 'Все' ? 'active' : ''}" onclick="filterProducts('Все')">Все</button>` +
                categories.map(c => `<button class="cat-btn ${currentFilter === c ? 'active' : ''}" onclick="filterProducts('${c}')">${c}</button>`).join('');
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const list = currentFilter === 'Все' ? products : products.filter(p => p.category === currentFilter);
            grid.innerHTML = list.map(p => `
                <div class="product-card animate-fade">
                    <img src="${p.img || 'https://via.placeholder.com/300'}" class="product-img">
                    <div class="product-info">
                        <span class="product-cat">${p.category}</span>
                        <h3 class="product-title">${p.name}</h3>
                        <p class="product-desc">${p.desc}</p>
                        <button class="btn-more" onclick="showProductDetails(${p.id})">Подробнее...</button>
                        <div class="product-footer" style="margin-top:auto;">
                            <span class="product-price">${p.price.toLocaleString()} ₽</span>
                            <button class="add-to-cart" onclick="addToCart(${p.id})"><i data-lucide="shopping-cart" size="18"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function showProductDetails(id) {
            const p = products.find(i => i.id === id);
            document.getElementById('detailsContent').innerHTML = `
                <img src="${p.img || 'https://via.placeholder.com/600x400'}" style="width:100%; height:300px; object-fit:cover; border-radius:12px; margin-bottom:1.5rem;">
                <span class="product-cat">${p.category}</span>
                <h2 style="margin: 0.5rem 0;">${p.name}</h2>
                <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem;">${p.desc}</p>
                <div style="display:flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 1.5rem;">
                    <span class="product-price" style="font-size: 1.8rem;">${p.price.toLocaleString()} ₽</span>
                    <button class="add-to-cart" style="padding: 1rem 2rem;" onclick="addToCart(${p.id}); closeDetailsModal();">В КОРЗИНУ</button>
                </div>
            `;
            document.getElementById('detailsModal').style.display = 'flex';
        }

        function closeDetailsModal() { document.getElementById('detailsModal').style.display = 'none'; }
        function filterProducts(c) { currentFilter = c; renderFilters(); renderProducts(); }

        function addToCart(id) {
            const p = products.find(i => i.id === id);
            const inCart = cart.find(i => i.id === id);
            if (inCart) inCart.qty++; else cart.push({ ...p, qty: 1 });
            saveData(); showToast('Добавлено!');
        }

        function updateCartCount() { document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + i.qty, 0); }

        function renderCart() {
            const list = document.getElementById('cartItemsList');
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            list.innerHTML = cart.length ? cart.map(i => `
                <div class="cart-item">
                    <img src="${i.img}"><div><h4>${i.name}</h4><p>${i.price} ₽</p></div>
                    <div class="cart-item-qty"><button class="qty-btn" onclick="updateQty(${i.id},-1)">-</button><span>${i.qty}</span><button class="qty-btn" onclick="updateQty(${i.id},1)">+</button></div>
                    <button class="remove-btn" onclick="removeFromCart(${i.id})"><i data-lucide="trash-2"></i></button>
                </div>`).join('') : '<p style="text-align:center;">Пусто</p>';
            document.getElementById('summaryTotal').innerText = total.toLocaleString() + ' ₽';
            lucide.createIcons();
        }

        function updateQty(id, d) {
            const i = cart.find(item => item.id === id);
            if (i) { i.qty += d; if (i.qty <= 0) return removeFromCart(id); saveData(); renderCart(); }
        }

        function removeFromCart(id) { cart = cart.filter(i => i.id !== id); saveData(); renderCart(); }

        function toggleAddressField() { document.getElementById('addressField').style.display = document.getElementById('deliveryMethod').value === 'Доставка' ? 'block' : 'none'; }

        async function handleCheckout(e) {
            e.preventDefault();
            if(!cart.length) return;
            const order = { id: Date.now(), date: new Date().toLocaleString(), customer: { name: document.getElementById('custName').value, phone: document.getElementById('custPhone').value, method: document.getElementById('deliveryMethod').value, address: document.getElementById('custAddress').value }, items: [...cart], total: cart.reduce((s, i) => s + (i.price * i.qty), 0), deliveryCost: 0, status: 'Новый' };
            orders.push(order);
            if(config.tgToken && config.tgChatId) {
                const text = `📦 ЗАКАЗ #${order.id}\n👤 ${order.customer.name}\n📞 ${order.customer.phone}\n🚚 ${order.customer.method}\n💰 ${order.total} ₽`;
                fetch(`https://api.telegram.org/bot${config.tgToken}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: config.tgChatId, text }) }).catch(()=>{});
            }
            cart = []; saveData(); alert('Заказ принят!'); showSection('home'); e.target.reset();
        }

        function handleAdminLogin(e) { e.preventDefault(); if(document.getElementById('adminPass').value === ADMIN_PASSWORD) { sessionStorage.setItem('isAdmin', 'true'); showAdmin(); } else alert('Ошибка'); }
        function logoutAdmin() { sessionStorage.removeItem('isAdmin'); showSection('home'); }

        function switchAdminTab(t, el) {
            document.querySelectorAll('.admin-tab').forEach(x => x.style.display = 'none');
            document.querySelectorAll('.admin-nav-item').forEach(x => x.classList.remove('active'));
            document.getElementById('admin' + t.charAt(0).toUpperCase() + t.slice(1) + 'Tab').style.display = 'block';
            el.classList.add('active');
            if(t === 'orders') renderAdminOrders();
            if(t === 'products') renderAdminProducts();
        }

        function renderAdminOrders() {
            const l = document.getElementById('adminOrdersList');
            l.innerHTML = orders.slice().reverse().map(o => `<tr><td>#${o.id}</td><td>${o.customer.name}</td><td>${o.total + o.deliveryCost} ₽</td><td>${o.customer.method === 'Доставка' ? `<input type="number" style="width:60px" value="${o.deliveryCost}" onchange="updateDel(${o.id}, this.value)">` : '—'}</td><td><span class="order-badge ${o.status==='Новый'?'badge-pending':'badge-success'}">${o.status}</span></td><td><button class="qty-btn" onclick="delOrder(${o.id})"><i data-lucide="trash"></i></button></td></tr>`).join('');
            lucide.createIcons();
        }

        function updateDel(id, v) { const o = orders.find(i => i.id === id); o.deliveryCost = parseInt(v) || 0; o.status = 'Ок'; saveData(); renderAdminOrders(); }
        function delOrder(id) { if(confirm('Удалить?')) { orders = orders.filter(o => o.id !== id); saveData(); renderAdminOrders(); } }

        function renderAdminProducts() {
            const l = document.getElementById('adminProductsList');
            l.innerHTML = products.map(p => `<tr><td><img src="${p.img}" style="width:40px;height:40px;object-fit:cover;"></td><td>${p.name}</td><td>${p.price} ₽</td><td><button class="qty-btn" onclick="openProductModal(${p.id})"><i data-lucide="edit"></i></button><button class="qty-btn" onclick="delProd(${p.id})"><i data-lucide="trash"></i></button></td></tr>`).join('');
            lucide.createIcons();
        }

        function delProd(id) { if(confirm('Удалить?')) { products = products.filter(p => p.id !== id); saveData(); renderAdminProducts(); } }

        function openProductModal(id = null) {
            const m = document.getElementById('productModal');
            document.getElementById('pCategory').innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
            if (id) {
                const p = products.find(i => i.id === id);
                document.getElementById('editProductId').value = p.id;
                document.getElementById('pName').value = p.name;
                document.getElementById('pPrice').value = p.price;
                document.getElementById('pCategory').value = p.category;
                document.getElementById('pDesc').value = p.desc;
                document.getElementById('pImg').value = p.img;
            } else { document.getElementById('productForm').reset(); document.getElementById('editProductId').value = ''; }
            m.style.display = 'flex';
        }

        function handleImageUpload(input) {
            if (input.files && input.files[0]) {
                const r = new FileReader();
                r.onload = e => document.getElementById('pImg').value = e.target.result;
                r.readAsDataURL(input.files[0]);
            }
        }

        function handleProductSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('editProductId').value;
            const p = { id: id ? parseInt(id) : Date.now(), name: document.getElementById('pName').value, price: parseInt(document.getElementById('pPrice').value), category: document.getElementById('pCategory').value, desc: document.getElementById('pDesc').value, img: document.getElementById('pImg').value };
            if (id) products[products.findIndex(i => i.id === parseInt(id))] = p; else products.push(p);
            saveData(); closeProductModal(); renderAdminProducts();
        }

        function closeProductModal() { document.getElementById('productModal').style.display = 'none'; }
        function saveAdminSettings() { config.tgToken = document.getElementById('tgToken').value; config.tgChatId = document.getElementById('tgChatId').value; saveData(); showToast('Сохранено'); }
        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }

        updateCartCount(); renderFilters(); renderProducts(); lucide.createIcons();
    </script>
</body>
</html>
