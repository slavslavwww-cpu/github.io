<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruru Burger Tycoon</title>
    <!-- Подключаем Tailwind CSS для современной верстки -->
    <script src="https://jsdelivr.net"></script>
    <style>
        @import url('https://googleapis.com');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            overflow-x: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .burger-shadow {
            filter: drop-shadow(0 20px 30px rgba(245, 158, 11, 0.3));
        }
        .click-particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            font-weight: 800;
            color: #fbbf24;
            text-shadow: 0 4px 12px rgba(251, 191, 36, 0.5);
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.8) translateY(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.2) translateY(-100px); opacity: 0; }
        }
        .bounce-custom {
            animation: microBounce 0.4s ease infinite alternate;
        }
        @keyframes microBounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-4px); }
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 selection:bg-amber-500 selection:text-slate-900">

    <!-- НАВИГАЦИЯ / ХЕДЕР -->
    <header class="w-full max-w-5xl mx-auto glass rounded-2xl p-4 flex justify-between items-center shadow-2xl border-b border-white/10">
        <div class="flex items-center gap-3">
            <!-- Логотип бренда Ruru Burger -->
            <div class="bg-amber-500 p-2.5 rounded-xl shadow-lg shadow-amber-500/20 flex items-center justify-center">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                    <path d="M3 11C3 7.5 6 6 12 6C18 6 21 7.5 21 11H3Z" fill="#1e1b4b"/>
                    <path d="M3 14C3 13 4 12 5 12H19C20 12 21 13 21 14C21 17.5 18 19 12 19C6 19 3 17.5 3 14Z" fill="#1e1b4b"/>
                    <path d="M4 12H20V13.5H4V12Z" fill="#ef4444"/>
                    <path d="M5 12.5L6 13M9 12.5L10 13M14 12.5L15 13M18 12.5L19 13" stroke="#facc15" stroke-width="0.75" stroke-linecap="round"/>
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">RURU BURGER</h1>
                <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Premium Kitchen</p>
            </div>
        </div>

        <!-- Баланс очков -->
        <div class="bg-slate-950/40 px-5 py-2 rounded-xl border border-white/5 flex items-center gap-3">
            <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Счет:</span>
            <span id="score-display" class="text-2xl font-extrabold text-amber-400 tabular-nums">0</span>
        </div>
    </header>

    <!-- ОСНОВНОЙ ИГРОВОЙ ЭКРАН -->
    <main class="w-full max-w-5xl mx-auto flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 my-6 items-center">
        
        <!-- ЛЕВАЯ ПАНЕЛЬ: НАШ ПЕРСОНАЖ (МАРИО-СТИЛЬ) -->
        <div class="lg:col-span-4 glass rounded-3xl p-6 flex flex-col items-center justify-center text-center relative overflow-hidden h-full min-h-[340px]">
            <div class="absolute inset-0 bg-gradient-to-b from-indigo-500/5 to-transparent pointer-events-none"></div>
            
            <!-- Оболочка персонажа с плавной микроанимацией покачивания -->
            <div class="relative w-44 h-44 mb-4 bounce-custom">
                <!-- Свечение за персонажем -->
                <div class="absolute inset-0 bg-indigo-500/20 blur-3xl rounded-full scale-75"></div>
                
                <!-- SVG Современный премиум Чиби-персонаж с бородой и мини-бургером -->
                <svg class="w-full h-full relative z-10" viewBox="0 0 200 200" fill="none" xmlns="http://w3.org">
                    <!-- Округлая голова (Чиби) -->
                    <circle cx="100" cy="90" r="42" fill="#ffd1a9"/>
                    
                    <!-- Современная стильная борода -->
                    <path d="M58 90C58 115 75 128 100 128C125 128 142 115 142 90C142 96 135 110 100 110C65 110 58 96 58 90Z" fill="#2d1e18"/>
                    <path d="M72 104C85 116 115 116 128 104C120 112 100 114 72 104Z" fill="#1a100c"/>
                    
                    <!-- Аккуратные усы -->
                    <path d="M75 96C88 96 95 104 100 104C105 104 112 96 125 96C115 92 105 94 100 95C95 94 85 92 75 96Z" fill="#2d1e18"/>
                    
                    <!-- Глаза (аниме/чиби стиль, крупные, выразительные) -->
                    <circle cx="82" cy="84" r="7" fill="#1e1510"/>
                    <circle cx="118" cy="84" r="7" fill="#1e1510"/>
                    <!-- Блики в глазах -->
                    <circle cx="80" cy="81" r="2.5" fill="#ffffff"/>
                    <circle cx="116" cy="81" r="2.5" fill="#ffffff"/>
                    
                    <!-- Уши -->
                    <circle cx="55" cy="90" r="8" fill="#ffd1a9"/>
                    <circle cx="145" cy="90" r="8" fill="#ffd1a9"/>
                    
                    <!-- Брови -->
                    <path d="M72 73C77 70 85 71 89 74" stroke="#2d1e18" stroke-width="3" stroke-linecap="round"/>
                    <path d="M128 73C123 70 115 71 111 74" stroke="#2d1e18" stroke-width="3" stroke-linecap="round"/>
                    
                    <!-- Нос -->
                    <path d="M96 87C96 89 98 91 100 91C102 91 104 89 104 87" stroke="#e0a980" stroke-width="2.5" stroke-linecap="round"/>
                    
                    <!-- Стильная современная кепка (Марио-формат, но козырек назад или ровно) -->
                    <path d="M56 70C56 46 72 40 100 40C128 40 144 46 144 70H56Z" fill="#ef4444"/>
                    <path d="M50 70C65 70 75 66 100 66C125 66 135 70 150 70C156 70 162 74 154 75C136 77 64 77 46 75C38 74 44 70 50 70Z" fill="#dc2626"/>
                    
                    <!-- ТЕЛО / ФОРМА ШЕФ-ПОВАРА -->
                    <path d="M68 126C64 140 66 185 66 185H134C134 185 136 140 132 126H68Z" fill="#1e293b"/>
                    <!-- Воротник формы -->
                    <path d="M80 126L100 142L120 126" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
                    
                    <!-- ЗНАЧЕК МИНИ-БУРГЕРА НА ГРУДИ (КОНТЕНТ ЗАПРОСА) -->
                    <!-- Фон значка -->
                    <circle cx="100" cy="158" r="14" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
                    <!-- Элементы мини-бургера -->
                    <path d="M93 156C93 153 95 152 100 152C105 152 107 153 107 156H93Z" fill="#f59e0b"/> <!-- Верхняя булка -->
                    <rect x="92" y="157" width="16" height="1.5" rx="0.5" fill="#ef4444"/> <!-- Котлета/Томат -->
                    <path d="M93 160C93 162 95 164 100 164C105 164 107 162 107 160H93Z" fill="#f59e0b"/> <!-- Нижняя булка -->
                    
                    <!-- Руки (в форме) -->
                    <path d="M68 132C60 138 52 150 54 162" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
                    <path d="M132 132C140 138 148 150 146 162" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
                    <!-- Перчатки / Ладошки -->
                    <circle cx="53" cy="166" r="8" fill="#ffffff"/>
                    <circle cx="147" cy="166" r="8" fill="#ffffff"/>
                </svg>
            </div>
            
            <span class="bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-[11px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wider mb-2">Шеф-Повар Ruru</span>
            <h3 class="text-xl font-bold text-white mb-1">Руру Мастер</h3>
            <p class="text-xs text-slate-400 max-w-[200px] leading-relaxed">Кликай по бургеру, чтобы помогать шефу собирать новые заказы!</p>
        </div>

        <!-- ЦЕНТРАЛЬНАЯ ПАНЕЛЬ: КЛИКЕР-БУРГЕР -->
        <div class="lg:col-span-5 flex flex-col items-center justify-center relative min-h-[380px]">
            <div id="click-area" class="relative cursor-pointer select-none transition-transform duration-75 active:scale-95 burger-shadow group">
                
                <!-- Пульсирующее фоновое свечение бургера -->
                <div class="absolute inset-0 bg-amber-500/15 blur-3xl rounded-full scale-110 group-hover:bg-amber-500/25 transition-colors duration-300"></div>
                
                <!-- ДЕТАЛЬНЫЙ АППЕТИТНЫЙ СУПЕР-БУРГЕР (SVG ВЫСОКОГО КАЧЕСТВА) -->
                <svg width="280" height="260" viewBox="0 0 280 260" fill="none" xmlns="http://w3.org" class="relative z-10 transition-transform duration-300 group-hover:rotate-1">
                    <!-- ВЕРХНЯЯ БУЛОЧКА (С кунжутом, объемная, пышная) -->
                    <path d="M30 100C30 45 70 30 140 30C210 30 250 45 250 100H30Z" fill="#E28743"/>
                    <path d="M35 95C35 48 73 36 140 36C207 36 245 48 245 95H35Z" fill="#F49746"/>
                    <!-- Кунжут -->
                    <ellipse cx="80" cy="60" rx="4" ry="2" fill="#FFF" transform="rotate(-15 80 60)"/>
                    <ellipse cx="110" cy="48" rx="4" ry="2" fill="#FFF" transform="rotate(10 110 48)"/>
