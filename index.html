<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Studio — Professional</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --apple-bg: rgba(255, 255, 255, 0.65);
            --apple-border: rgba(255, 255, 255, 0.4);
            --apple-text: #1d1d1f;
            --apple-accent: #0071e3;
            --apple-blur: 25px;
        }
        * { box-sizing: border-box; font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: -0.01em; }
        body { margin: 0; padding: 0; overflow: hidden; background: #f5f5f7; color: var(--apple-text); user-select: none; }
        
        /* Панель управления macOS Style */
        #ui-panel { 
            position: absolute; top: 20px; left: 20px; 
            background: var(--apple-bg); backdrop-filter: blur(var(--apple-blur)); -webkit-backdrop-filter: blur(var(--apple-blur));
            border: 1px solid var(--apple-border); padding: 24px; border-radius: 22px; width: 340px; z-index: 10; 
            box-shadow: 0 12px 40px rgba(0,0,0,0.08); display: flex; flex-direction: column; max-height: calc(100vh - 40px);
        }
        .scrollable-content { overflow-y: auto; flex-grow: 1; padding-right: 4px; }
        .scrollable-content::-webkit-scrollbar { width: 4px; }
        .scrollable-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }

        h3 { margin: 0 0 16px 0; color: #000; font-size: 17px; font-weight: 600; }
        h3.section-2 { margin-top: 20px; border-top: 1px solid rgba(0,0,0,0.06); padding-top: 16px; }

        /* Элементы управления */
        .control-group { margin-bottom: 14px; }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; font-weight: 500; color: #515154; }
        .val { color: var(--apple-accent); font-weight: 600; background: rgba(0, 113, 227, 0.08); padding: 2px 8px; border-radius: 6px; }
        
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 5px; background: rgba(0,0,0,0.08); border-radius: 10px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.15); cursor: pointer; transition: transform 0.1s; }
        input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.15); }

        /* Сегментный переключатель Apple для материалов */
        .segmented-control { display: flex; background: rgba(0,0,0,0.05); padding: 3px; border-radius: 10px; margin-bottom: 15px; }
        .segment-btn { flex: 1; border: none; background: transparent; padding: 6px 0; font-size: 12px; font-weight: 500; border-radius: 8px; cursor: pointer; color: #515154; transition: all 0.2s; }
        .segment-btn.active { background: #fff; color: #000; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }

        /* Список деталей iOS Style */
        #parts-list { margin-top: 8px; font-size: 13px; background: rgba(255,255,255,0.45); border-radius: 14px; border: 1px solid rgba(0,0,0,0.02); }
        .part-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid rgba(0,0,0,0.04); }
        .part-item:last-child { border-bottom: none; }
        .part-name { font-weight: 400; color: #1d1d1f; }
        .part-dim { font-weight: 500; color: #86868b; font-variant-numeric: tabular-nums; }

        .apple-btn { width: 100%; padding: 12px; background: var(--apple-accent); color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 15px; transition: background 0.2s; box-shadow: 0 4px 12px rgba(0, 113, 227, 0.15); }
        .apple-btn:hover { background: #0077ed; }
        
        #hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 500; z-index: 10; pointer-events: none; opacity: 0.8; }
    </style>
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="hint">💡 Кликните на фасад, чтобы открыть/закрыть дверцы</div>

    <div id="ui-panel">
        <div class="scrollable-content">
            <h3>🪵 Параметры шкафа (мм)</h3>
            <div class="control-group">
                <div class="label-row"><span>Ширина</span><span id="w-val" class="val">800</span></div>
                <input type="range" id="width" min="400" max="1600" value="800" step="10">
            </div>
            <div class="control-group">
                <div class="label-row"><span>Высота</span><span id="h-val" class="val">1600</span></div>
                <input type="range" id="height" min="600" max="2200" value="1600" step="10">
            </div>
            <div class="control-group">
                <div class="label-row"><span>Глубина</span><span id="d-val" class="val">500</span></div>
                <input type="range" id="depth" min="300" max="800" value="500" step="10">
            </div>
            <div class="control-group">
                <div class="label-row"><span>Количество полок</span><span id="shelves-val" class="val">3</span></div>
                <input type="range" id="shelves" min="0" max="6" value="3" step="1">
            </div>

            <h3>🎨 Материал корпуса</h3>
            <div class="segmented-control">
                <button class="segment-btn active" onclick="changeMaterial('white', this)">Белый</button>
                <button class="segment-btn" onclick="changeMaterial('oak', this)">Дуб Сонома</button>
                <button class="segment-btn" onclick="changeMaterial('graphite', this)">Графит</button>
            </div>

            <h3 class="section-2">📊 Спецификация ЛДСП</h3>
            <div id="parts-list"></div>
        </div>
        <button class="apple-btn" onclick="exportCSV()">Экспорт в Excel (CSV)</button>
    </div>

    <script>
        // --- 1. ИНИЦИАЛИЗАЦИЯ СЦЕНЫ APPLE STUDIO ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f5f7);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(1400, 1100, 1700);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.03;
        controls.target.set(0, 700, 0);

        // --- 2. МЯГКИЙ СТУДИЙНЫЙ СВЕТ ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.75));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.45);
        dirLight.position.set(1200, 2500, 1000);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        // Матовый невидимый пол для мягкой тени
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000), new THREE.ShadowMaterial({ opacity: 0.07 }));
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- 3. МАТЕРИАЛЫ И ТЕКСТУРЫ ---
        const materials = {
            white: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.15 }),
            oak: new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.4 }),
            graphite: new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.25 }),
            back: new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.4 })
        };
        let currentMaterial = materials.white;

        const furnitureGroup = new THREE.Group();
        scene.add(furnitureGroup);

        // Переменные для анимации дверей
        let doorsArray = [];
        let doorsOpened = false;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const THICKNESS = 16;
        const BACK_THICKNESS = 4;
        let globalParts = [];

        // --- 4. ПАРАМЕТРИЧЕСКАЯ СБОРКА ШКАФА ---
        function rebuildFurniture() {
            // Очищаем старые объекты
            doorsArray.forEach(d => furnitureGroup.remove(d.pivot));
            doorsArray = [];
            while(furnitureGroup.children.length > 0){ furnitureGroup.remove(furnitureGroup.children[0]); }
            globalParts = [];

            const W = parseFloat(document.getElementById('width').value);
            const H = parseFloat(document.getElementById('height').value);
            const D = parseFloat(document.getElementById('depth').value);
            const numShelves = parseInt(document.getElementById('shelves').value);

            document.getElementById('w-val').innerText = W + " мм";
            document.getElementById('h-val').innerText = H + " мм";
            document.getElementById('d-val').innerText = D + " мм";
            document.getElementById('shelves-val').innerText = numShelves;

            // Хелпер для создания деталей
            function createPanel(w, h, d, x, y, z, mat, name) {
                const geo = new THREE.BoxGeometry(w, h, d);
